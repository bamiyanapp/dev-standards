name: "Deploy to GitHub Pages"
description: >-
  Node.jsプロジェクトをビルドし、GitHub Pagesへデプロイする定型パターン
  （setup-node → npm ci → build → upload-pages-artifact → deploy-pages）
  を共通化した複合アクション。呼び出し側ジョブは`environment: { name: github-pages }`と
  `permissions: { pages: write, id-token: write }`を指定する必要がある
  （複合アクションからはjob単位の設定を行えないため）。

inputs:
  working-directory:
    description: "ビルド対象のディレクトリ（package-lock.jsonが存在する場所。workspaces: trueの場合はビルドコマンドの実行先ディレクトリのみを指し、依存インストールはリポジトリルートで行う）"
    required: true
  node-version:
    description: "ビルドに使うNode.jsのバージョン"
    required: false
    default: "22"
  build-command:
    description: "ビルドコマンド"
    required: false
    default: "npm run build"
  artifact-path:
    description: "GitHub Pagesにアップロードする成果物のパス（ビルド出力ディレクトリ）"
    required: true
  workspaces:
    description: "呼び出し元がnpm workspaces構成（ルート直下に単一のpackage-lock.jsonのみを持つ）かどうか。trueの場合、依存インストールをリポジトリルートで行う（reusable-ci.ymlの同名inputと同じ意味）。"
    required: false
    default: "false"

outputs:
  page-url:
    description: "デプロイされたGitHub PagesのURL"
    value: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: ${{ inputs.workspaces == 'true' && 'package-lock.json' || format('{0}/package-lock.json', inputs.working-directory) }}
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.workspaces == 'true' && '.' || inputs.working-directory }}
      run: npm ci
    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}
    # artifact名にrun_attemptを含める。既定の名前（github-pages）のままだと、「失敗したジョブを再実行」で
    # ビルドからやり直したときに、同じrunへ同名のartifactが2つできる。deploy-pagesが
    # 「Multiple artifacts named "github-pages" were unexpectedly found」で失敗し、以降そのrunは
    # 再実行しても復旧できない（issue #1458）。upload-pages-artifactのnameとdeploy-pagesの
    # artifact_nameへ、同じ値を渡す
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ inputs.artifact-path }}
    # issue #1604: upload直後に、deploy-pagesが「No artifacts named ... were found」で、
    # 散発的に失敗する（アップロード直後の取得の競合。結果整合と見られる）。
    # アーティファクトの一覧を待つAPIは、呼び出し側へactions: read権限を要求するため使わない。
    # 代わりに、失敗しても、そのjobを止めず、数秒待って1回だけ再試行する。
    # 1回目が成功した場合、待ちも再試行も入らない（遅延を足さない）
    - name: Deploy to GitHub Pages
      id: deployment
      continue-on-error: true
      uses: actions/deploy-pages@v5
      with:
        artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Wait before retrying the deployment
      if: steps.deployment.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::deploy-pagesが失敗したため、15秒待って1回だけ再試行します（dev-standards#1604）"
        sleep 15
    - name: Deploy to GitHub Pages (retry)
      id: deployment-retry
      if: steps.deployment.outcome == 'failure'
      uses: actions/deploy-pages@v5
      with:
        artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
