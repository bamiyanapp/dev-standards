name: "Check coverage threshold"
description: >-
  coverage/coverage-summary.json（vitestのjson-summaryレポーター等が生成するv8/istanbul形式の集計）を
  読み、Job Summaryにカバレッジを表示する。thresholdが0より大きい場合、いずれかの指標が下回っていれば
  失敗する。coverage-summary.jsonが存在しない場合はthreshold未指定（0以下）なら何もせずスキップし、
  threshold指定時はエラーで失敗する。

inputs:
  working-directory:
    description: "coverage/coverage-summary.jsonを探すディレクトリ（パッケージのルート）"
    required: true
  threshold:
    description: "カバレッジ閾値（%）。0以下の場合はゲートせず、表示のみ行う"
    required: false
    default: "0"
  label:
    description: "Job Summary上の見出しに使うラベル（例: frontend）。省略時はworking-directoryのディレクトリ名"
    required: false
    default: ""
  metrics:
    description: >-
      閾値判定の対象とする指標をカンマ区切りで指定する（例: "branches"）。省略時はlines/statements/
      functions/branchesの全4種を判定対象にする。表自体は常に全指標を表示し、判定のみ絞り込む
    required: false
    default: ""
  check-per-file:
    description: >-
      "true"の場合、total（パッケージ全体平均）に加えて、ファイル単位でも同じ指標・閾値で判定する。
      一部のファイルのカバレッジが著しく低くても全体平均でクリアしてしまう問題に対応する
    required: false
    default: "false"
  per-file-metrics:
    description: >-
      check-per-file有効時、ファイル単位の判定にのみ使う指標をカンマ区切りで指定する（例: "lines,statements,branches"）。
      省略時はmetricsと同じ値を使う。V8カバレッジのfunctions指標は、テストファイルを複数ワーカー
      プロセスへ分散実行する構成でプロセス間のカバレッジ集計に起因して非決定的になることがあり
      （issue #307）、呼び出し回数の少ない小さな関数を含むファイルが実行のたびに偶発的に閾値未満と
      判定されうる。functionsをper-file判定からのみ除外する、といった用途を想定
    required: false
    default: ""

  baseline-total-file:
    description: >-
      ベースライン（baseブランチの`coverage-summary.json`の`total`）のJSONファイルのパス（任意）。
      指定すると、各指標の分母（total）を比較し、警告の倍率を超えて増減していれば警告し、失敗の倍率を
      超えていれば失敗する（issue #1366）。ファイルが無ければ、比較をスキップする。
      PRがテスト対象のソースを大きく増減させた場合は正当な変化のため、失敗の倍率は緩めにしてある
    required: false
    default: ""
  total-warn-ratio:
    description: "分母がベースラインの何倍超（または何分の1未満）で警告するか"
    required: false
    default: "2"
  total-fail-ratio:
    description: "分母がベースラインの何倍超（または何分の1未満）で失敗させるか"
    required: false
    default: "5"
  allowed-path-prefixes:
    description: >-
      集計対象として想定するパスの先頭（working-directoryからの相対、カンマ区切り）。
      これ以外で始まるパスと、node_modulesを含むパスが集計対象にあれば警告する
    required: false
    default: "src/"

runs:
  using: "composite"
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        THRESHOLD: ${{ inputs.threshold }}
        LABEL: ${{ inputs.label }}
        METRICS: ${{ inputs.metrics }}
        PER_FILE_METRICS: ${{ inputs.per-file-metrics }}
        CHECK_PER_FILE: ${{ inputs.check-per-file }}
        BASELINE_TOTAL_FILE: ${{ inputs.baseline-total-file }}
        TOTAL_WARN_RATIO: ${{ inputs.total-warn-ratio }}
        TOTAL_FAIL_RATIO: ${{ inputs.total-fail-ratio }}
        ALLOWED_PATH_PREFIXES: ${{ inputs.allowed-path-prefixes }}
      run: node "${{ github.action_path }}/check-coverage.js"
