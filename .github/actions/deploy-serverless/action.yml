name: "Deploy via Serverless Framework"
description: >-
  Serverless Framework（osls等のCLIフォーク含む）を使ったAWSデプロイの定型パターン
  （setup-node → npm ci → デプロイコマンド実行）を共通化した複合アクション。npm workspaces
  構成かつ`package.individually: true`で多数のLambda関数を個別packagingする場合、
  node_modules配下の走査でランナーのデフォルトのファイルディスクリプタ上限（1024）を
  超えて`EMFILE: too many open files`が発生することがあるため（bamiyanapp/karuta#608,
  #663で実際に発生・対応）、デフォルトでデプロイコマンド実行前にソフトリミットを
  ハードリミットまで引き上げる（`raise-fd-limit: false`で無効化可能）。ulimitの変更は
  同一シェルプロセス内でのみ有効なため、引き上げとデプロイコマンドの実行は同一stepの
  同一`run`ブロック内で行う。

inputs:
  working-directory:
    description: "serverless.ymlが存在するディレクトリ"
    required: true
  node-version:
    description: "デプロイに使うNode.jsのバージョン"
    required: false
    default: "22"
  deploy-command:
    description: "実行するデプロイコマンド（例: npx osls deploy、npx serverless deploy）"
    required: false
    default: "npx serverless deploy"
  workspaces:
    description: "呼び出し元がnpm workspaces構成（ルート直下に単一のpackage-lock.jsonのみを持つ）かどうか。trueの場合、依存インストールをリポジトリルートで行う（reusable-ci.ymlの同名inputと同じ意味）。"
    required: false
    default: "false"
  raise-fd-limit:
    description: "デプロイコマンド実行前にファイルディスクリプタのソフトリミットをハードリミットまで引き上げるかどうか"
    required: false
    default: "true"
  check-broken-symlinks:
    description: >-
      デプロイ前に、working-directory配下のリンク切れのsymlinkを検知し、あれば失敗させるかどうか
      （bamiyanapp/dev-standards#1386）。shared/lambdaをsymlinkで使う構成で、チェックアウトに
      `submodules: true`が無いと、symlinkの実体が無く、serverless packageは成功するがzipに
      ファイルが含まれず、デプロイ後に全関数がCannot find moduleで起動に失敗する。
      リンク切れのままデプロイして正常に動く構成は考えにくいため、既定で有効にする
    required: false
    default: "true"
  smoke-test-url:
    description: >-
      デプロイ後に疎通確認するURL（任意）。指定すると、GETして200以外なら失敗させる
      （起動直後の失敗に備え、最大3回、5秒おきに再試行する）。副作用の無いGETで確認できる
      エンドポイントを指定すること。E2EがAPIをモックしている構成では、デプロイされた
      バックエンドの異常を、これ以外に検知する手段が無い
    required: false
    default: ""
  verify-package:
    description: >-
      デプロイ前に、`serverless package`で生成したzipを展開し、serverless.ymlの全ハンドラを
      読み込めることを検証するかどうか（issue #1452）。symlink先の欠落や`package.patterns`の誤りで、
      zipからファイルが抜けていても、serverless packageは成功する。既定は無効（`false`）。
      ハンドラ読み込み時に必要な環境変数は、呼び出し側の`env`で渡すこと
    required: false
    default: "false"
  verify-package-forbid:
    description: "verify-packageで、zipに含まれていてはならないファイルのglob（空白区切り。例: `*.test.js seed*.js`）。"
    required: false
    default: ""
  aws-access-key-id:
    description: "AWSアクセスキーID"
    required: true
  aws-secret-access-key:
    description: "AWSシークレットアクセスキー"
    required: true

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: ${{ inputs.workspaces == 'true' && 'package-lock.json' || format('{0}/package-lock.json', inputs.working-directory) }}
    - name: リンク切れのsymlinkを検知する
      if: inputs.check-broken-symlinks == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        broken=$(find . -xtype l -not -path '*/node_modules/*' || true)
        if [ -n "$broken" ]; then
          echo "::error::リンク切れのsymlinkがあります。デプロイすると、パッケージにファイルが含まれず、全関数が起動に失敗します。チェックアウトに submodules: true を指定してください。"
          echo "$broken"
          exit 1
        fi
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.workspaces == 'true' && '.' || inputs.working-directory }}
      run: npm ci
    - name: デプロイパッケージを検証する
      if: inputs.verify-package == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FORBID: ${{ inputs.verify-package-forbid }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        npx serverless package --stage verify-package
        forbid_args=()
        for g in $FORBID; do forbid_args+=(--forbid "$g"); done
        zip=$(ls .serverless/*.zip | head -n 1)
        node "$ACTION_PATH/../../../scripts/verify-lambda-package.js" --zip "$zip" --service-file serverless.yml "${forbid_args[@]}"
    - name: Deploy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "${{ inputs.raise-fd-limit }}" = "true" ]; then
          echo "file descriptor limits: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          ulimit -n "$(ulimit -Hn)"
          echo "file descriptor limit after adjustment: $(ulimit -n)"
        fi
        ${{ inputs.deploy-command }}
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
    - name: デプロイ後に疎通確認する
      if: inputs.smoke-test-url != ''
      shell: bash
      env:
        SMOKE_TEST_URL: ${{ inputs.smoke-test-url }}
      run: |
        for attempt in 1 2 3; do
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SMOKE_TEST_URL" || echo "000")
          echo "疎通確認 $attempt 回目: HTTP $status"
          if [ "$status" = "200" ]; then exit 0; fi
          sleep 5
        done
        echo "::error::デプロイ後の疎通確認に失敗しました（最後のHTTPステータス: $status）。デプロイされたバックエンドが正常に動いていない可能性があります。"
        exit 1
