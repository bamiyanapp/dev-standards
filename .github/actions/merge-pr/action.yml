name: "Merge pull request (squash)"
description: >-
  現在のPRをsquash mergeし、作業ブランチを削除する複合アクション
  （`reusable-ci.yml`の`merge` jobが内蔵する処理と同じロジック）。
  `frontend_dir`がmatrix非対応でスカラー値のみのため、複数アプリ向けに
  `reusable-ci.yml`を独立して複数回呼び出す構成（1 job per appパターン、
  issue #421）を採る参照側リポジトリ向けに提供する。この構成では各呼び出しに
  `enable_auto_merge: false`を指定し、全呼び出しの成否を`needs`で待つ
  呼び出し側自前のgate jobから、このアクションを直接呼び出してマージする。

inputs:
  github-token:
    description: >-
      squash merge・ブランチ削除に使うトークン。base_branchへのpushで
      CDワークフローがトリガーされる必要があるため、`secrets.GITHUB_TOKEN`
      ではなく`secrets.BOT_TOKEN`を渡すことを推奨する
      （`GITHUB_TOKEN`によるpushは新たなworkflow実行を作らないため）。
    required: true

runs:
  using: "composite"
  steps:
    - name: Merge pull request
      id: merge-pr
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { mergePrWithRetry, deleteBranchIgnoringNotFound } = require(
            "${{ github.action_path }}/../lib/mergePrWithRetry.js"
          );

          const prNumber = context.payload.pull_request.number;
          const branchName = context.payload.pull_request.head.ref;

          // issue #1068。reusable-ci.ymlのmergeジョブ（PR #1069）と同じ理由。
          // このactionを呼び出す側のgate jobも他jobの完了を待つため、実行開始
          // からここに至るまで数分かかることがある。その間にPRが人間または
          // API操作でcloseされていても、ワークフロー実行自体は自動キャンセル
          // されないため、closeに気づかずマージしてしまう。マージ直前にPRの
          // 現在状態を取得し、openでなければスキップする
          const { data: currentPr } = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber
          });
          if (currentPr.state !== "open") {
            console.log(`PR #${prNumber} is no longer open (state: ${currentPr.state}). Skipping merge.`);
            return;
          }

          console.log(`Attempting to merge PR #${prNumber}`);
          const mergeSha = await mergePrWithRetry({ github, context, pullNumber: prNumber });
          core.setOutput("merge_sha", mergeSha);

          console.log(`Attempting to delete branch: ${branchName}`);
          await deleteBranchIgnoringNotFound({ github, context, branchName });

outputs:
  merge-sha:
    description: "squash merge後に生成されたコミットのSHA"
    value: ${{ steps.merge-pr.outputs.merge_sha }}
