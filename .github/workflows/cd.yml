name: CD
# CIのrun-name規約（コミットメッセージを含める）に倣い、コミットSHAの羅列ではなく
# 内容が分かる表示にする（issue #344、bamiyanapp/uchi-stock#337）。
# workflow_dispatch時はhead_commitが存在せず空文字列になるが、
# 「CD (manual)」の表示自体で判別可能なため許容する
run-name: >-
  CD (${{ github.event_name == 'workflow_dispatch' && 'manual' || 'push' }})
  ${{ github.event.head_commit.message }}

# issue #187（CI/CD実行回数・実行時間削減バックログ）⑥・#220により、mainへの
# mergeごとの即時deployから1日4回（UTC 0/6/12/18時）のscheduleへ変更していたが、
# この変更の動機（GitHub Actions無料枠消費の抑制）はプライベートリポジトリ固有の
# 制約であり、dev-standardsは現在パブリックリポジトリのためActions無料枠の制限が
# 無い。そのため即時deploy（pushトリガー）へ戻す（issue #330）。
# workflow_dispatchは検証・緊急時の手動実行用。
on:
  push:
    branches: [main]
  workflow_dispatch:

# issue #1636: workflow全体の権限は最小（読み取りのみ）にし、書き込みが要るjobだけが、
# 自分のjobで宣言する（zizmor excessive-permissions）
permissions:
  contents: read

jobs:
  # 自リポジトリのreusable-cd.ymlをdogfoodingする。相対パス参照のため、このPRで
  # 変更中のreusable-cd.yml自体の内容がそのまま使われる（@main参照ではない）。
  release:
    name: "リリース"
    uses: ./.github/workflows/reusable-cd.yml
    # リリース（タグ・GitHub Release・CHANGELOGのコミット・リリースPR）に必要な権限
    permissions:
      contents: write
      pull-requests: write
    with:
      enable_shared_release_config: false
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  # 参照側アプリ一覧のハブページ（issue #636）。site/apps.json・README.mdの内容には
  # semantic-releaseのバージョン番号を含まないため、releaseジョブの結果（新バージョンが
  # 発行されたか）に関わらず、pushのたびに常に再デプロイする。dev-standardsは
  # パブリックリポジトリでActions無料枠の制限が無いため、この実行回数は問題にならない
  # （releaseジョブがpushトリガーへ戻した際の判断と同じ、上記run-name付近のコメント参照）
  deploy-pages:
    name: "参照側アプリ一覧ページのデプロイ"
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: チェックアウトする
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: GitHub Pagesへデプロイする
        id: deploy
        uses: ./.github/actions/deploy-github-pages
        with:
          working-directory: site
          artifact-path: site/dist
