name: CD
# CIのrun-name規約（コミットメッセージを含める）に倣い、コミットSHAの羅列ではなく
# 内容が分かる表示にする（issue #344、bamiyanapp/uchi-stock#337）。
# workflow_dispatch時はhead_commitが存在せず空文字列になるが、
# 「CD (manual)」の表示自体で判別可能なため許容する
run-name: >-
  CD (${{ github.event_name == 'workflow_dispatch' && 'manual' || 'push' }})
  ${{ github.event.head_commit.message }}

# issue #187（CI/CD実行回数・実行時間削減バックログ）⑥・#220により、mainへの
# mergeごとの即時deployから1日4回（UTC 0/6/12/18時）のscheduleへ変更していたが、
# この変更の動機（GitHub Actions無料枠消費の抑制）はプライベートリポジトリ固有の
# 制約であり、dev-standardsは現在パブリックリポジトリのためActions無料枠の制限が
# 無い。そのため即時deploy（pushトリガー）へ戻す（issue #330）。
# workflow_dispatchは検証・緊急時の手動実行用。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # 自リポジトリのreusable-cd.ymlをdogfoodingする。相対パス参照のため、このPRで
  # 変更中のreusable-cd.yml自体の内容がそのまま使われる（@main参照ではない）。
  release:
    uses: ./.github/workflows/reusable-cd.yml
    with:
      enable_shared_release_config: false
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
