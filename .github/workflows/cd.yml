name: CD
run-name: CD (${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }})

# issue bamiyanapp/dev-standards#187（CI/CD実行回数・実行時間削減バックログ）⑥:
# mainへのmergeごとの即時deployをやめ、1日4回（UTC 0/6/12/18時）のscheduleへ
# まとめる。GitHubのscheduleイベントはpushと同様にデフォルトブランチの
# refs/heads/<default-branch>に対して実行され、release jobの
# context.ref.replace("refs/heads/", "") によるbaseBranch取得もそのまま動作する。
# workflow_dispatchは検証・緊急時の手動実行用。
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # 自リポジトリのreusable-cd.ymlをdogfoodingする。相対パス参照のため、このPRで
  # 変更中のreusable-cd.yml自体の内容がそのまま使われる（@main参照ではない）。
  release:
    uses: ./.github/workflows/reusable-cd.yml
    with:
      enable_shared_release_config: false
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
