# dev-standards#1634の調査用の一時workflow。APIで、どの設定が読めるかを調べる。調査後に削除する（tmp-接頭辞）
name: Tmp probe repo settings
run-name: Tmp probe repo settings

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    name: "設定が読めるかを調べる"
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウトする
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: 各設定のAPIの結果を調べる
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          BOT_TOKEN_VALUE: ${{ secrets.BOT_TOKEN }}
        run: |
          set -eu
          node - <<'JS' | tee -a "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const { listConsumerRepositories } = require("./scripts/consumer-repositories");
          const tokens = { GITHUB_TOKEN: process.env.GITHUB_TOKEN_VALUE, BOT_TOKEN: process.env.BOT_TOKEN_VALUE };
          const endpoints = [
            ["repo(security_and_analysis)", (r) => `/repos/${r}`],
            ["非公開報告", (r) => `/repos/${r}/private-vulnerability-reporting`],
            ["Dependabot alerts", (r) => `/repos/${r}/vulnerability-alerts`],
            ["ruleset", (r) => `/repos/${r}/rulesets`],
            ["Actions権限", (r) => `/repos/${r}/actions/permissions/workflow`],
            ["SECURITY.md", (r) => `/repos/${r}/contents/SECURITY.md`],
          ];
          async function call(token, path) {
            const res = await fetch(`https://api.github.com${path}`, { headers: { authorization: `Bearer ${token}`, accept: "application/vnd.github+json" } });
            let extra = "";
            if (res.status === 200 && path.split("/").length === 3) {
              const j = await res.json();
              const s = j.security_and_analysis;
              extra = s ? `sa=${Object.keys(s).map((k) => `${k}:${s[k].status}`).join(",")}` : "sa=無し";
            }
            return `${res.status}${extra ? " " + extra : ""}`;
          }
          (async () => {
            console.log("## 設定の読み取り可否（HTTPステータス）\n");
            console.log("| リポジトリ | トークン | " + endpoints.map((e) => e[0]).join(" | ") + " |");
            console.log("| --- | --- | " + endpoints.map(() => "---").join(" | ") + " |");
            const repos = ["bamiyanapp/dev-standards", ...listConsumerRepositories(fs.readFileSync("docs/consumer-repositories.md", "utf8")).map((r) => r.repo)];
            for (const name of repos) {
              for (const [tname, token] of Object.entries(tokens)) {
                if (!token) continue;
                const cells = [];
                for (const [, f] of endpoints) cells.push(await call(token, f(name)));
                console.log(`| ${name} | ${tname} | ${cells.join(" | ")} |`);
              }
            }
          })();
          JS
