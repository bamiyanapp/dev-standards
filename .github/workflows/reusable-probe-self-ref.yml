# 一時的な検証用（issue #1316）。検証後に削除する
name: probe-self-ref (reusable)
on:
  workflow_call: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: run APIのreferenced_workflowsから自身の参照が取れるか確認する（追加権限なし）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "--- with token (contents: read only)"
          curl -sS -o with.json -w "status=%{http_code}\n" -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          jq -c '.referenced_workflows // .message' with.json || head -c 300 with.json
          echo "--- without token"
          curl -sS -o without.json -w "status=%{http_code}\n" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
          jq -c '.referenced_workflows // .message' without.json || head -c 300 without.json
          echo "--- resolved"
          jq -r '[.referenced_workflows[]? | select(.path | startswith("bamiyanapp/dev-standards/.github/workflows/reusable-probe-self-ref.yml@"))][0].sha // "NONE"' with.json | sed 's/^/resolved_sha=/'
