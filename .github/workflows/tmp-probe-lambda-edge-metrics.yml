# 目的: Lambda@Edgeの監視に使えるCloudWatchメトリクスの、実在する名前・名前空間・ディメンション名を確認する。
# 対応するissue: dev-standards#1367
# 作成日: 2026-11-20
# 読み取り専用（list-metricsのみ）。アカウント固有の値（ディストリビューションID・関数名の値）は、出力しない。
# 確認が終わったら、このファイルは削除する（tmp-* は、14日を超えて残ると警告される）。
name: tmp-probe-lambda-edge-metrics

on:
  push:
    branches: [claude/dev-efficiency-improvements-6wlv2c]
    paths: [".github/workflows/tmp-probe-lambda-edge-metrics.yml"]

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 認証情報の有無を確認する（値は出さない）
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "AWSの認証情報が、このリポジトリのSecretsに見つかりません" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "認証情報あり" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: メトリクスの名前・ディメンション名を確認する
        run: |
          {
            echo "### AWS/CloudFront（us-east-1）: メトリクス名とディメンション名の組（値は出さない）"
            aws cloudwatch list-metrics --namespace AWS/CloudFront --region us-east-1 --output json \
              | jq -r '[.Metrics[] | {m: .MetricName, d: ([.Dimensions[].Name] | sort | join(","))}] | unique | .[] | "\(.m)\t\(.d)"'
            echo
            echo "### AWS/Lambda（us-east-1）: Lambda@Edgeのレプリカらしい関数（us-east-1.という接頭辞）の、メトリクス名の一覧"
            aws cloudwatch list-metrics --namespace AWS/Lambda --region us-east-1 --output json \
              | jq -r '[.Metrics[] | select(any(.Dimensions[]; .Name=="FunctionName" and (.Value|startswith("us-east-1."))))] | "件数: \(length)", "メトリクス名: \([.[].MetricName] | unique | join(", "))"'
            echo
            echo "### Lambda@Edgeのメトリクスが出る、他のリージョンの有無（件数のみ）"
            for region in us-west-2 eu-west-1 ap-northeast-1; do
              count=$(aws cloudwatch list-metrics --namespace AWS/Lambda --region "$region" --output json \
                | jq '[.Metrics[] | select(any(.Dimensions[]; .Name=="FunctionName" and (.Value|startswith("us-east-1."))))] | length')
              echo "$region: $count"
            done
            echo
            echo "### CloudFrontのカスタムメトリクス名前空間（AWS/CloudFront以外）の有無"
            aws cloudwatch list-metrics --region us-east-1 --output json \
              | jq -r '[.Metrics[].Namespace] | unique | map(select(test("CloudFront|Edge"))) | join(", ")'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
