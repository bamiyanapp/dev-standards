name: Reusable Promote Canary to Stable

# issue #757（#733の検討対象）。karuta issue #1331（ブルーグリーンデプロイ導入
# Task 12）・issue #1411（stableがcanaryを追い越している場合のガード）で実装した、
# CloudFormationスタックのLastUpdatedTimeを流用した経過日数判定による自動昇格
# ワークフローを一般化したもの。
#
# 「経過日数」の判定は、専用のタイムスタンプ管理を新設せず、backendのcanary
# CloudFormationスタックのLastUpdatedTime（未更新の場合はCreationTime）をそのまま
# 使う。カナリア直列化（reusable-ci.yml等での同時1件制限）が無い場合、猶予期間内に
# 複数回デプロイされるとタイマーがその都度リセットされてしまう点は既知の制約。
#
# stableがcanaryより新しい場合（緊急手動デプロイ等でstableがcanaryを追い越している
# 場合）、昇格を安全側にスキップする（karuta issue #1411）。
#
# デプロイコマンド・ビルドコマンドはプロダクトのツールチェイン（Serverless
# Framework/osls、Vite等）に依存するため、inputsとして文字列をそのまま渡す
# 構成にする。
#
# issue #916: GitHub Actionsのscheduleトリガーは発火時刻が数時間単位でずれる
# ことがあり、grace_period_daysの日単位（24時間単位）の判定では、前回更新
# からの経過時間がわずかに1日分へ届かず昇格が1サイクル分遅延するケースが
# あった。grace_period_hoursで時間単位の猶予期間も指定できるようにする
# （既定は0で、未指定ならgrace_period_daysを時間換算して使う後方互換動作）。
#
# issue #919: 本ワークフローはジョブ先頭で1回だけcheckoutし（main最新HEAD）、
# 「2. canaryのコードでstableへ昇格する」ステップと「5. キュー待ち分を新しい
# canaryへデプロイする」ステップの両方でこの同じcheckoutを使い回していた。
# 結果、「canaryのコードで昇格する」はずが実際には「ジョブ開始時点のmain
# 最新HEAD」を昇格しており、canaryで一度も検証されていないキュー待ち
# コミットがcanaryを経由せず直接stableへ昇格されてしまっていた。
#
# これを修正するため、canaryへ実際にデプロイしたコミットをgitタグ
# （canary_tag_name）で記録する。昇格時はこのタグのコミットをgit worktreeで
# 別途checkoutし、そちらをstableへデプロイする（main最新HEADではなく）。
# タグが存在しない場合（初回実行等）は、記録が無いため従来通りmain最新
# HEADにフォールバックする。

on:
  workflow_call:
    inputs:
      canary_stack_name:
        description: "backend canaryのCloudFormationスタック名。"
        type: string
        required: true
      stable_stack_name:
        description: "backend stableのCloudFormationスタック名。"
        type: string
        required: true
      kvs_arn:
        description: "canary_weight・force_stable・canary_queue_pendingを保持するCloudFront KeyValueStoreのARN。"
        type: string
        required: true
      grace_period_days:
        description: "canaryデプロイからこの日数が経過し、かつforce_stableが設定されていなければ昇格対象とする。grace_period_hoursが指定された場合はそちらが優先される。"
        type: number
        default: 7
      grace_period_hours:
        description: >-
          猶予期間を時間単位で指定する（issue #916）。0（既定）の場合は
          grace_period_days * 24時間を使う。GitHub Actionsのscheduleトリガーは
          発火時刻が数時間単位でずれることがあり、grace_period_daysの日単位
          （24時間単位）の判定では、前回更新からの経過時間がわずかに24時間へ
          届かず1サイクル分（1日）昇格が遅延するケースがあったため、より
          細かい時間単位で猶予期間を調整できるようにする。
        type: number
        default: 0
      node_version:
        description: "デプロイ・ビルドに使うNode.jsのバージョン。"
        type: string
        default: "22"
      workspaces:
        description: "呼び出し元がnpm workspaces構成かどうか。trueの場合、依存インストールをリポジトリルートで一括実行する。"
        type: boolean
        default: true
      backend_working_directory:
        description: "backendのserverless.ymlが存在するディレクトリ。"
        type: string
        required: true
      backend_deploy_command_stable:
        description: "canaryのコードでbackend stableスタックを再デプロイ（昇格）するコマンド（例: npx osls deploy --stage stable）。"
        type: string
        required: true
      backend_remove_canary_command:
        description: "昇格後にbackend canaryスタックを削除するコマンド（例: npx osls remove --stage canary）。"
        type: string
        required: true
      backend_deploy_command_canary:
        description: "キュー待ちの更新を新しいcanaryへデプロイするコマンド（例: npx osls deploy --stage canary）。カナリア直列化（キュー機構）を使わない場合は省略可能。"
        type: string
        default: ""
      frontend_build_command_stable:
        description: "canaryのビルドでfrontend stable/を再デプロイするためのビルドコマンド。"
        type: string
        default: ""
      frontend_build_command_canary:
        description: "キュー待ちの更新を新しいcanaryのフロントエンドとしてビルドするコマンド。カナリア直列化を使わない場合は省略可能。"
        type: string
        default: ""
      frontend_dist_dir:
        description: "フロントエンドのビルド成果物ディレクトリ。"
        type: string
        default: "frontend/dist"
      infra_stack_name:
        description: "フロントエンドのS3バケット名・CloudFront distribution IDをOutputsから取得するためのCloudFormationスタック名。frontend_build_command_stableを指定しない場合は不要。"
        type: string
        default: ""
      frontend_bucket_output_key:
        description: "infra_stack_nameのOutputsのうち、S3バケット名を保持するOutputKey。"
        type: string
        default: "FrontendBucketName"
      frontend_distribution_id_output_key:
        description: "infra_stack_nameのOutputsのうち、CloudFront distribution IDを保持するOutputKey。"
        type: string
        default: "FrontendDistributionId"
      aws_region:
        description: "CloudFormationスタックが存在するAWSリージョン。"
        type: string
        default: "ap-northeast-1"
      kvs_region:
        description: "KVS操作APIが存在するAWSリージョン。"
        type: string
        default: "us-east-1"
      canary_exists_kvs_key:
        description: >-
          canaryスタックの存否をCloudFront Functions側へ伝えるKVSキー名
          （bamiyanapp/dev-standards#876、karuta issue #1489）。`/canary/`への
          明示アクセス時、canaryスタックが存在しない状態でもルーティングを試みて
          失敗することを避け、stableへフォールバックさせる用途を想定する。
          省略時（既定の空文字列）はこのキーの更新を一切行わない後方互換の挙動になる
        type: string
        default: ""
      canary_tag_name:
        description: >-
          canaryへ実際にデプロイしたコミットを記録するgitタグ名（issue #919）。
          昇格時はこのタグのコミットをstableへデプロイする（main最新HEADでは
          なく）ことで、canaryで検証されていないコミットが直接stableへ昇格
          されることを防ぐ。
        type: string
        default: "canary-deployed"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: write # issue #919: canary_tag_nameのgitタグをpushするために必要

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
      stable_ahead_of_canary: ${{ steps.check.outputs.stable_ahead_of_canary }}
      queue_processed: ${{ steps.queue.outputs.process }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        working-directory: ${{ inputs.workspaces && '.' || inputs.backend_working_directory }}
        run: npm ci

      # issue #919: canaryが実際にデプロイしたコミット（canary_tag_name）を
      # 解決する。タグが存在し、かつ現在のmain最新HEADと異なる場合のみ、
      # そのコミットをgit worktreeで別途checkoutし、stableへの昇格に使う。
      # タグが無い場合（初回実行等、検証履歴が無い）はmain最新HEADへ
      # フォールバックする（従来の挙動）
      - name: canaryが実際に検証したコミットを解決する
        id: canary_commit
        run: |
          set -eu
          TAG="${{ inputs.canary_tag_name }}"
          CURRENT_SHA=$(git rev-parse HEAD)
          if git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" 2>/dev/null; then
            CANARY_SHA=$(git rev-parse "refs/tags/${TAG}")
            echo "exists=true" >> "$GITHUB_OUTPUT"
            if [ "$CANARY_SHA" = "$CURRENT_SHA" ]; then
              echo "canaryの検証済みコミット（${CANARY_SHA}）は現在のmain最新HEADと同一のため、worktreeは不要"
              echo "use_worktree=false" >> "$GITHUB_OUTPUT"
            else
              echo "canaryの検証済みコミット: ${CANARY_SHA}（main最新HEAD ${CURRENT_SHA} とは異なる）"
              echo "use_worktree=true" >> "$GITHUB_OUTPUT"
              echo "sha=${CANARY_SHA}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "canary_tag_name（${TAG}）が見つからないため、main最新HEADへフォールバックする"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "use_worktree=false" >> "$GITHUB_OUTPUT"
          fi

      - name: canaryが実際に検証したコミットのworktreeを用意する
        if: steps.canary_commit.outputs.use_worktree == 'true'
        run: git worktree add --detach canary-validated "${{ steps.canary_commit.outputs.sha }}"

      - name: canaryが実際に検証したコミット向けの依存関係をインストールする
        if: steps.canary_commit.outputs.use_worktree == 'true'
        working-directory: ${{ inputs.workspaces && 'canary-validated' || format('canary-validated/{0}', inputs.backend_working_directory) }}
        run: npm ci

      - name: 昇格対象かどうかを判定する
        id: check
        run: |
          set -eu
          CANARY_STACK="${{ inputs.canary_stack_name }}"
          STABLE_STACK="${{ inputs.stable_stack_name }}"
          GRACE_PERIOD_DAYS="${{ inputs.grace_period_days }}"
          GRACE_PERIOD_HOURS_INPUT="${{ inputs.grace_period_hours }}"
          # issue #916: grace_period_hoursが指定されていれば時間単位で、
          # 未指定（0）ならgrace_period_daysを時間換算して使う
          if [ "$GRACE_PERIOD_HOURS_INPUT" -gt 0 ]; then
            GRACE_PERIOD_HOURS="$GRACE_PERIOD_HOURS_INPUT"
          else
            GRACE_PERIOD_HOURS=$(( GRACE_PERIOD_DAYS * 24 ))
          fi

          if ! aws cloudformation describe-stacks --stack-name "$CANARY_STACK" >/dev/null 2>&1; then
            echo "canaryスタックが存在しないため対象外"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_UPDATED=$(aws cloudformation describe-stacks --stack-name "$CANARY_STACK" --query "Stacks[0].LastUpdatedTime" --output text)
          if [ "$LAST_UPDATED" = "None" ]; then
            LAST_UPDATED=$(aws cloudformation describe-stacks --stack-name "$CANARY_STACK" --query "Stacks[0].CreationTime" --output text)
          fi
          LAST_UPDATED_EPOCH=$(date -d "$LAST_UPDATED" +%s)
          NOW_EPOCH=$(date -u +%s)
          ELAPSED_HOURS=$(( (NOW_EPOCH - LAST_UPDATED_EPOCH) / 3600 ))
          echo "canaryスタックの最終更新から${ELAPSED_HOURS}時間経過（${LAST_UPDATED}）"

          if [ "$ELAPSED_HOURS" -lt "$GRACE_PERIOD_HOURS" ]; then
            echo "猶予期間（${GRACE_PERIOD_HOURS}時間）未経過のため対象外"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KVS_ARN="${{ inputs.kvs_arn }}"
          FORCE_STABLE=$(aws cloudfront-keyvaluestore get-key --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --key "force_stable" --query Value --output text 2>/dev/null || echo "false")
          if [ "$FORCE_STABLE" = "true" ]; then
            echo "force_stableがtrue（ロールバック済み）のため対象外"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # stableが緊急手動デプロイ等でcanaryを追い越している場合、昇格すると
          # 緊急対応した内容がcanaryの古いコードで上書きされ退行してしまう
          if aws cloudformation describe-stacks --stack-name "$STABLE_STACK" >/dev/null 2>&1; then
            STABLE_LAST_UPDATED=$(aws cloudformation describe-stacks --stack-name "$STABLE_STACK" --query "Stacks[0].LastUpdatedTime" --output text)
            if [ "$STABLE_LAST_UPDATED" = "None" ]; then
              STABLE_LAST_UPDATED=$(aws cloudformation describe-stacks --stack-name "$STABLE_STACK" --query "Stacks[0].CreationTime" --output text)
            fi
            STABLE_LAST_UPDATED_EPOCH=$(date -d "$STABLE_LAST_UPDATED" +%s)
            if [ "$STABLE_LAST_UPDATED_EPOCH" -gt "$LAST_UPDATED_EPOCH" ]; then
              echo "stableの最終更新（${STABLE_LAST_UPDATED}）がcanaryより新しいため対象外（緊急デプロイ等でcanaryを追い越している可能性がある）"
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "stable_ahead_of_canary=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: 1. KVSの重みをcanary 100%へ更新する
        if: steps.check.outputs.eligible == 'true'
        run: |
          set -eu
          KVS_ARN="${{ inputs.kvs_arn }}"
          ETAG=$(aws cloudfront-keyvaluestore describe-key-value-store --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --query ETag --output text)
          aws cloudfront-keyvaluestore put-key --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --if-match "$ETAG" --key "canary_weight" --value "100" >/dev/null
          echo "canary_weight を 100 に設定した"

      - name: "2. canaryのコードでbackend stableスタックを再デプロイする（昇格）"
        if: steps.check.outputs.eligible == 'true'
        # issue #919: canaryが実際に検証したコミット（worktree）が解決できて
        # いればそちらを、無ければmain最新HEAD（従来の挙動）を使う
        working-directory: ${{ steps.canary_commit.outputs.use_worktree == 'true' && format('canary-validated/{0}', inputs.backend_working_directory) || inputs.backend_working_directory }}
        run: ${{ inputs.backend_deploy_command_stable }}

      - name: "2. canaryのビルドでfrontend stable/を再デプロイする（昇格）"
        if: steps.check.outputs.eligible == 'true' && inputs.frontend_build_command_stable != ''
        working-directory: ${{ steps.canary_commit.outputs.use_worktree == 'true' && 'canary-validated' || '.' }}
        run: |
          set -eu
          ${{ inputs.frontend_build_command_stable }}
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name "${{ inputs.infra_stack_name }}" --query "Stacks[0].Outputs" --output json)
          BUCKET=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="${{ inputs.frontend_bucket_output_key }}") | .OutputValue')
          DIST_ID=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="${{ inputs.frontend_distribution_id_output_key }}") | .OutputValue')
          aws s3 sync "${{ inputs.frontend_dist_dir }}" "s3://${BUCKET}/stable/" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/stable/*'

      - name: 3. canaryスタックを削除する
        if: steps.check.outputs.eligible == 'true'
        working-directory: ${{ inputs.backend_working_directory }}
        run: ${{ inputs.backend_remove_canary_command }}

      - name: 4. KVSをリセットする（重みを既定値、force_stableをfalseへ）
        if: steps.check.outputs.eligible == 'true'
        run: |
          set -eu
          KVS_ARN="${{ inputs.kvs_arn }}"
          ETAG=$(aws cloudfront-keyvaluestore describe-key-value-store --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --query ETag --output text)
          aws cloudfront-keyvaluestore put-key --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --if-match "$ETAG" --key "canary_weight" --value "10" >/dev/null
          ETAG2=$(aws cloudfront-keyvaluestore describe-key-value-store --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --query ETag --output text)
          aws cloudfront-keyvaluestore put-key --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --if-match "$ETAG2" --key "force_stable" --value "false" >/dev/null
          echo "KVSを既定値（canary_weight=10, force_stable=false）へリセットした"

      - name: canary_exists_kvs_keyをfalseへ更新する（canaryスタックを削除したため）
        if: steps.check.outputs.eligible == 'true' && inputs.canary_exists_kvs_key != ''
        run: |
          set -eu
          KVS_ARN="${{ inputs.kvs_arn }}"
          ETAG=$(aws cloudfront-keyvaluestore describe-key-value-store --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --query ETag --output text)
          aws cloudfront-keyvaluestore put-key --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --if-match "$ETAG" --key "${{ inputs.canary_exists_kvs_key }}" --value "false" >/dev/null
          echo "${{ inputs.canary_exists_kvs_key }} を false へ更新した"

      - name: 5. canaryが空いているか・キュー待ちの更新が無いかを確認する
        id: queue
        if: inputs.backend_deploy_command_canary != ''
        run: |
          set -eu
          KVS_ARN="${{ inputs.kvs_arn }}"
          CANARY_STACK="${{ inputs.canary_stack_name }}"
          FREE=false
          if ! aws cloudformation describe-stacks --stack-name "$CANARY_STACK" >/dev/null 2>&1; then
            FREE=true
          else
            FORCE_STABLE=$(aws cloudfront-keyvaluestore get-key --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --key "force_stable" --query Value --output text 2>/dev/null || echo "false")
            if [ "$FORCE_STABLE" = "true" ]; then
              FREE=true
            fi
          fi
          echo "canaryの空き状況: ${FREE}"

          # stableがcanaryより新しい（緊急手動デプロイ等でcanaryを追い越している）
          # 場合、canaryは古くて意味の無いトライアルであり、キュー待ちの有無に
          # 関わらず強制的に最新化する（karuta issue #1448）。これを無条件化
          # しないと、canaryスタックが存在し続けfree=falseのまま、昇格・
          # リフレッシュどちらにも進めず永久に詰まり続けてしまう
          if [ "${{ steps.check.outputs.stable_ahead_of_canary }}" = "true" ]; then
            echo "stableがcanaryより新しいため、キュー待ちの有無に関わらず強制的に最新化する"
            echo "process=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PENDING=false
          if [ "$FREE" = "true" ]; then
            PENDING=$(aws cloudfront-keyvaluestore get-key --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --key "canary_queue_pending" --query Value --output text 2>/dev/null || echo "false")
          fi
          echo "キュー待ちの更新: ${PENDING}"
          echo "process=$([ "$FREE" = "true" ] && [ "$PENDING" = "true" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: "5. キュー待ちのbackendを新しいcanaryとしてデプロイする"
        if: steps.queue.outputs.process == 'true'
        working-directory: ${{ inputs.backend_working_directory }}
        run: ${{ inputs.backend_deploy_command_canary }}

      - name: "5. キュー待ちのfrontendを新しいcanaryとしてデプロイする"
        if: steps.queue.outputs.process == 'true' && inputs.frontend_build_command_canary != ''
        run: |
          set -eu
          ${{ inputs.frontend_build_command_canary }}
          OUTPUTS=$(aws cloudformation describe-stacks --stack-name "${{ inputs.infra_stack_name }}" --query "Stacks[0].Outputs" --output json)
          BUCKET=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="${{ inputs.frontend_bucket_output_key }}") | .OutputValue')
          DIST_ID=$(echo "$OUTPUTS" | jq -r '.[] | select(.OutputKey=="${{ inputs.frontend_distribution_id_output_key }}") | .OutputValue')
          aws s3 sync "${{ inputs.frontend_dist_dir }}" "s3://${BUCKET}/canary/" --delete
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/canary/*'

      - name: キュー待ちの更新を処理したら、canary_queue_pendingをfalseへリセットする
        if: steps.queue.outputs.process == 'true'
        run: |
          set -eu
          KVS_ARN="${{ inputs.kvs_arn }}"
          ETAG=$(aws cloudfront-keyvaluestore describe-key-value-store --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --query ETag --output text)
          aws cloudfront-keyvaluestore put-key --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --if-match "$ETAG" --key "canary_queue_pending" --value "false" >/dev/null
          echo "canary_queue_pending を false へリセットした"

      - name: canary_exists_kvs_keyをtrueへ更新する（canaryを実際にデプロイしたため）
        if: steps.queue.outputs.process == 'true' && inputs.canary_exists_kvs_key != ''
        run: |
          set -eu
          KVS_ARN="${{ inputs.kvs_arn }}"
          ETAG=$(aws cloudfront-keyvaluestore describe-key-value-store --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --query ETag --output text)
          aws cloudfront-keyvaluestore put-key --region "${{ inputs.kvs_region }}" --kvs-arn "$KVS_ARN" --if-match "$ETAG" --key "${{ inputs.canary_exists_kvs_key }}" --value "true" >/dev/null
          echo "${{ inputs.canary_exists_kvs_key }} を true へ更新した"

      # issue #919: 新しいcanaryのデプロイに成功した時点のコミットを記録する。
      # 次回昇格時、このタグのコミット（＝canaryが実際に検証したコミット）を
      # stableへデプロイすることで、未検証のコミットが直接stableへ昇格される
      # ことを防ぐ
      - name: canary_tag_nameをcanaryへデプロイしたコミットへ更新する
        if: steps.queue.outputs.process == 'true'
        run: |
          set -eu
          TAG="${{ inputs.canary_tag_name }}"
          git tag -f "$TAG" HEAD
          git push origin "refs/tags/${TAG}" --force

      - name: Write summary
        if: always()
        run: |
          set -eu
          {
            echo "## 自動昇格 実行結果"
            echo ""
            echo "昇格対象: ${{ steps.check.outputs.eligible == 'true' && 'はい（昇格を実行した）' || 'いいえ（対象外のためスキップした）' }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.stable_ahead_of_canary }}" = "true" ]; then
            {
              echo "**⚠️ 要確認**: stableの最終更新がcanaryより新しいため、今回の昇格をスキップした。"
              echo "緊急手動デプロイ等でstableがcanaryを追い越している可能性がある。"
              echo "このままでは今後も昇格が永続的にスキップされ続ける。canaryを最新の内容で更新するか、この状況の対応方針を人間が判断すること。"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "キュー待ち更新の処理: ${{ steps.queue.outputs.process == 'true' && 'はい（新しいcanaryとしてデプロイした）' || 'いいえ' }}"
          } >> "$GITHUB_STEP_SUMMARY"
