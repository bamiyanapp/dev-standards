name: tmp-probe-env-precedence
# issue #1582の調査用の一時workflow（調査後に削除する）。AWSには触れない。
# ジョブのenv:と、ステップがGITHUB_ENVへ書いた値の、どちらが優先されるかを確かめる
on:
  push:
    branches:
      - claude/dev-efficiency-improvements-6wlv2c
    paths:
      - ".github/workflows/tmp-probe-env-precedence.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      PROBE_EMPTY: ""
      PROBE_SET: "from-job-env"
    steps:
      - name: GITHUB_ENVへ書く
        run: |
          echo "PROBE_EMPTY=from-github-env" >> "$GITHUB_ENV"
          echo "PROBE_SET=from-github-env" >> "$GITHUB_ENV"
      - name: 次のstepで読む
        run: |
          {
            echo "## env優先順位の確認"
            echo "- ジョブのenvが空 → GITHUB_ENVの値: ${PROBE_EMPTY}"
            echo "- ジョブのenvが値あり → GITHUB_ENVの値: ${PROBE_SET}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
