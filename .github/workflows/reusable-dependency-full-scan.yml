name: Reusable Dependency Full Vulnerability Scan

# issue #1095。既存のdependency-risk-summary job（reusable-ci.yml）は、PRの
# package-lock.json差分に対してのみ動作するため、Renovateが更新PRを出さない限り
# 一度も実行されない。間接依存は親パッケージのバージョン範囲内で解決されるため、
# 親パッケージ自体がrange外の新しいバージョンを必要とする脆弱性修正を取り込めない
# 場合、Renovateは通常検知できない（lockFileMaintenance有効化後も残るギャップ、
# issue #1094参照）。
#
# 本ワークフローは更新PRの有無に関わらず、呼び出し元リポジトリで現時点で
# ロックされている依存パッケージ全体（直接・間接問わず）をスケジュール実行等で
# 定期的にスキャンし、検知結果をトラッキング用issueへ反映する（新規作成、
# または既存issueの本文更新）。dependency-deprecation-scan（issue #969）と
# 同じ設計に揃える。
#
# karuta/promote-canary.yml等と同様、scheduleトリガー自体は呼び出し元リポジトリの
# workflowが持つ（reusable workflow自身はworkflow_callのみ）。

on:
  workflow_call:
    inputs:
      lockfile_path:
        description: "スキャン対象のpackage-lock.jsonのパス（リポジトリルート相対）。"
        type: string
        default: "package-lock.json"
      tracking_issue_title:
        description: "検知結果を反映するissueのタイトル。同名のopen issueが既にあれば本文を更新し、無ければ新規作成する。"
        type: string
        default: "[自動] 依存パッケージの既知脆弱性検知（定期スキャン）"
      tracking_issue_labels:
        description: "トラッキングissue作成時に付与するラベル（JSON配列文字列）。issue駆動の原則（CLAUDE.md）に従い、型・重要度ラベルを呼び出し元で指定すること。"
        type: string
        default: '["bug", "priority: medium"]'
      self_ref:
        description: >-
          呼び出し元が本workflowを`uses: bamiyanapp/dev-standards/.github/workflows/reusable-dependency-full-scan.yml@<ref>`
          で参照した際の`<ref>`と同じ値（タグ・ブランチ・コミットSHA）を指定する必須入力。
          本workflow内でdev-standards自身のスクリプト（scripts/dependency-full-scan.js）を
          ローカルチェックアウトする際に使う（dev-standards#1144、issue #1071と同種の問題）。
          `github.workflow_ref`では動的解決できないため、reusable-ci.ymlと同じ方式で
          呼び出し元に明示的な入力として渡してもらう
        type: string
        required: true
    outputs:
      has_vulnerabilities:
        description: "既知の脆弱性が1件以上検知されたか。"
        value: ${{ jobs.scan.outputs.has_vulnerabilities }}

permissions:
  contents: read

jobs:
  scan:
    name: "依存パッケージの既知脆弱性スキャン"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    outputs:
      has_vulnerabilities: ${{ steps.scan.outputs.has_vulnerabilities }}
    steps:
      - name: チェックアウトする
        uses: actions/checkout@v7

      - name: Node.jsをセットアップする
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # scripts/dependency-full-scan.jsはdev-standards自身のスクリプトのため、
      # 参照側リポジトリ（karuta等）では別途チェックアウトする必要がある
      # （「reusable workflow参照のバージョン固定」docs/cicd-pipeline-specification.md参照）。
      # refはハードコードせず、呼び出し元から渡されるself_ref（本workflow自身が
      # 呼び出された際のref）を使う（dev-standards#1144）。ハードコードしていた
      # 旧実装では、呼び出し元がバージョンを上げても本チェックアウトだけ古いまま
      # 固定され、スクリプトの修正（issue #1111等）が反映されない事故が発生した
      - name: dev-standardsをチェックアウトする（ローカルスクリプト用）
        uses: actions/checkout@v7
        with:
          repository: bamiyanapp/dev-standards
          ref: ${{ inputs.self_ref }}
          path: .dev-standards-actions

      - name: 既知の脆弱性をスキャンする
        id: scan
        run: node .dev-standards-actions/scripts/dependency-full-scan.js "${{ inputs.lockfile_path }}" > /tmp/full-scan-result.json

      # issue #1172。issue検索・作成/更新/クローズの制御フロー自体は
      # reusable-dependency-deprecation-scan.yml・reusable-runtime-version-scan.yml
      # と完全に同一のため、共通action（tracking-issue-sync）へ切り出した。
      # 本文組み立て（表の列・文言）のみ、ここで呼び出し元として行う
      - name: Issue本文を組み立てる
        id: body
        if: steps.scan.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const findings = JSON.parse(fs.readFileSync("/tmp/full-scan-result.json", "utf-8"));
            const rows = findings.map((f) => {
              const ids = f.vulnerabilities.map((v) => v.id).join(", ");
              const severity = f.vulnerabilities.map((v) => v.severityRating).filter(Boolean).join(", ") || "不明";
              return `| ${f.name} | ${f.version} | ${f.direct ? "直接" : "間接"} | ${ids} | ${severity} |`;
            }).join("\n");
            const body = [
              "対象リポジトリの`package-lock.json`を対象にした定期スキャンで、既知の脆弱性が見つかりました。",
              "",
              "| パッケージ | バージョン | 直接/間接 | 脆弱性ID | Severity |",
              "|---|---|---|---|---|",
              rows,
              "",
              "### 対応候補",
              "",
              "- 親パッケージ（間接依存の場合）に、該当パッケージを取り込んだ新バージョンが出ていればそちらへ更新する",
              "- 親パッケージ側が未対応の場合、`package.json`の`overrides`で該当パッケージのバージョンを強制固定する（互換性リスクがあるため、固定後は該当機能の動作確認が必要）",
              "- 影響が深刻かつ代替手段が無い場合、該当パッケージの採用自体を見直す",
              "",
              `_このissueは自動更新されます（最終更新: ${new Date().toISOString()}）_`,
            ].join("\n");
            core.setOutput("body", body);

      - name: トラッキングissueを同期する
        uses: ./.dev-standards-actions/.github/actions/tracking-issue-sync
        with:
          title: ${{ inputs.tracking_issue_title }}
          has-findings: ${{ steps.scan.outputs.has_vulnerabilities }}
          body: ${{ steps.body.outputs.body }}
          labels: ${{ inputs.tracking_issue_labels }}
          close-comment: "再スキャンの結果、既知の脆弱性が検知されなくなったため自動クローズします。"
          github-token: ${{ github.token }}

      # dev-standards#1149: 検知結果の詳細（パッケージ名・バージョン・直接/間接・
      # 脆弱性ID・Severity）は従来トラッキングissueの本文にのみ書き込んでおり、
      # Job Summary・ジョブログには件数のみしか出していなかった。issueタブへの
      # 遷移無しでも確認できるよう、同じ詳細表をJob Summary・標準出力の両方へ出す。
      # `tee`で両方に書くのは、sandbox-unreachable-investigation Skillの既知の知見
      # （Job Summaryの内容はAPI経由で取得できないため、ジョブログにも同じ内容を
      # 出しておく）と同じ理由
      - name: 概要を出力する
        if: always()
        run: |
          set -eu
          node -e '
            const fs = require("fs");
            let body = "## 依存パッケージ既知脆弱性スキャン 実行結果\n\n";
            const hasVulnerabilities = "${{ steps.scan.outputs.has_vulnerabilities }}" === "true";
            if (!hasVulnerabilities) {
              body += "既知の脆弱性は検知されませんでした。\n";
            } else {
              const findings = JSON.parse(fs.readFileSync("/tmp/full-scan-result.json", "utf-8"));
              body += `検知件数: ${findings.length}件\n\n`;
              body += "| パッケージ | バージョン | 直接/間接 | 脆弱性ID | Severity |\n";
              body += "|---|---|---|---|---|\n";
              for (const f of findings) {
                const ids = f.vulnerabilities.map((v) => v.id).join(", ");
                const severity = f.vulnerabilities.map((v) => v.severityRating).filter(Boolean).join(", ") || "不明";
                body += `| ${f.name} | ${f.version} | ${f.direct ? "直接" : "間接"} | ${ids} | ${severity} |\n`;
              }
            }
            fs.writeFileSync("/tmp/full-scan-summary.md", body);
          '
          tee -a "$GITHUB_STEP_SUMMARY" < /tmp/full-scan-summary.md
