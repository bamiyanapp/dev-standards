name: Reusable Dependency Full Vulnerability Scan

# issue #1095。既存のdependency-risk-summary job（reusable-ci.yml）は、PRの
# package-lock.json差分に対してのみ動作するため、Renovateが更新PRを出さない限り
# 一度も実行されない。間接依存は親パッケージのバージョン範囲内で解決されるため、
# 親パッケージ自体がrange外の新しいバージョンを必要とする脆弱性修正を取り込めない
# 場合、Renovateは通常検知できない（lockFileMaintenance有効化後も残るギャップ、
# issue #1094参照）。
#
# 本ワークフローは更新PRの有無に関わらず、呼び出し元リポジトリで現時点で
# ロックされている依存パッケージ全体（直接・間接問わず）をスケジュール実行等で
# 定期的にスキャンし、検知結果をトラッキング用issueへ反映する（新規作成、
# または既存issueの本文更新）。dependency-deprecation-scan（issue #969）と
# 同じ設計に揃える。
#
# karuta/promote-canary.yml等と同様、scheduleトリガー自体は呼び出し元リポジトリの
# workflowが持つ（reusable workflow自身はworkflow_callのみ）。

on:
  workflow_call:
    inputs:
      lockfile_path:
        description: "スキャン対象のpackage-lock.jsonのパス（リポジトリルート相対）。"
        type: string
        default: "package-lock.json"
      tracking_issue_title:
        description: "検知結果を反映するissueのタイトル。同名のopen issueが既にあれば本文を更新し、無ければ新規作成する。"
        type: string
        default: "[自動] 依存パッケージの既知脆弱性検知（定期スキャン）"
      tracking_issue_labels:
        description: "トラッキングissue作成時に付与するラベル（JSON配列文字列）。issue駆動の原則（CLAUDE.md）に従い、型・重要度ラベルを呼び出し元で指定すること。"
        type: string
        default: '["bug", "priority: medium"]'
      self_ref:
        description: >-
          呼び出し元が本workflowを`uses: bamiyanapp/dev-standards/.github/workflows/reusable-dependency-full-scan.yml@<ref>`
          で参照した際の`<ref>`と同じ値（タグ・ブランチ・コミットSHA）を指定する必須入力。
          本workflow内でdev-standards自身のスクリプト（scripts/dependency-full-scan.js）を
          ローカルチェックアウトする際に使う（dev-standards#1144、issue #1071と同種の問題）。
          `github.workflow_ref`では動的解決できないため、reusable-ci.ymlと同じ方式で
          呼び出し元に明示的な入力として渡してもらう
        type: string
        required: true
    outputs:
      has_vulnerabilities:
        description: "既知の脆弱性が1件以上検知されたか。"
        value: ${{ jobs.scan.outputs.has_vulnerabilities }}

permissions:
  contents: read

jobs:
  scan:
    name: "依存パッケージの既知脆弱性スキャン"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: read
    outputs:
      has_vulnerabilities: ${{ steps.scan.outputs.has_vulnerabilities }}
    steps:
      - name: チェックアウトする
        uses: actions/checkout@v7

      - name: Node.jsをセットアップする
        uses: actions/setup-node@v7
        with:
          node-version: 26

      # scripts/dependency-full-scan.jsはdev-standards自身のスクリプトのため、
      # 参照側リポジトリ（karuta等）では別途チェックアウトする必要がある
      # （「reusable workflow参照のバージョン固定」docs/cicd-pipeline-specification.md参照）。
      # refはハードコードせず、呼び出し元から渡されるself_ref（本workflow自身が
      # 呼び出された際のref）を使う（dev-standards#1144）。ハードコードしていた
      # 旧実装では、呼び出し元がバージョンを上げても本チェックアウトだけ古いまま
      # 固定され、スクリプトの修正（issue #1111等）が反映されない事故が発生した
      - name: dev-standardsをチェックアウトする（ローカルスクリプト用）
        uses: actions/checkout@v7
        with:
          repository: bamiyanapp/dev-standards
          ref: ${{ inputs.self_ref }}
          path: .dev-standards-actions

      - name: 既知の脆弱性をスキャンする
        id: scan
        run: node .dev-standards-actions/scripts/dependency-full-scan.js "${{ inputs.lockfile_path }}" > /tmp/full-scan-result.json

      # issue #1163。フルスキャンは「Renovateが既に対応PRを作成済みか」を見ずに
      # 新規検知として起票・更新してしまい、Renovate対応中（minimumReleaseAge待機中・
      # Human Review待ち等）の脆弱性と二重管理になる混乱を招いていた。各パッケージ名を
      # タイトルに含むopenなPRが既に存在する場合、その番号をfindingへ付与する
      - name: 対応中のPRを確認する
        id: related-prs
        if: steps.scan.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const { findRelatedPullRequest } = require("./.dev-standards-actions/scripts/dependency-full-scan.js");
            const findings = JSON.parse(fs.readFileSync("/tmp/full-scan-result.json", "utf-8"));
            const openPullRequests = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
            });
            const withRelatedPr = findings.map((f) => ({
              ...f,
              relatedPr: findRelatedPullRequest(f.name, openPullRequests),
            }));
            fs.writeFileSync("/tmp/full-scan-result-with-pr.json", JSON.stringify(withRelatedPr));

      # issue #1172。issue検索・作成/更新/クローズの制御フロー自体は
      # reusable-dependency-deprecation-scan.yml・reusable-runtime-version-scan.yml
      # と完全に同一のため、共通action（tracking-issue-sync）へ切り出した。
      # 本文組み立て（表の列・文言）のみ、ここで呼び出し元として行う
      - name: Issue本文を組み立てる
        id: body
        if: steps.scan.outputs.has_vulnerabilities == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const findings = JSON.parse(fs.readFileSync("/tmp/full-scan-result-with-pr.json", "utf-8"));
            const rows = findings.map((f) => {
              const ids = f.vulnerabilities.map((v) => v.id).join(", ");
              const severity = f.vulnerabilities.map((v) => v.severityRating).filter(Boolean).join(", ") || "不明";
              const relatedPr = f.relatedPr ? `#${f.relatedPr.number}` : "（無し）";
              return `| ${f.name} | ${f.version} | ${f.direct ? "直接" : "間接"} | ${ids} | ${severity} | ${relatedPr} |`;
            }).join("\n");
            const body = [
              "対象リポジトリの`package-lock.json`を対象にした定期スキャンで、既知の脆弱性が見つかりました。",
              "",
              "「対応PR」列は、パッケージ名をタイトルに含むopenなPRが既に存在する場合のみ記載する。該当PRが既にRenovate等による対応中であることを示す目安であり、自動検知のため誤検出もあり得る。",
              "",
              "| パッケージ | バージョン | 直接/間接 | 脆弱性ID | Severity | 対応PR |",
              "|---|---|---|---|---|---|",
              rows,
              "",
              "### 対応候補",
              "",
              "- 対応PRが既にある場合は、そのPRのマージを待つ（新たな対応は不要）",
              "- 親パッケージ（間接依存の場合）に、該当パッケージを取り込んだ新バージョンが出ていればそちらへ更新する",
              "- 親パッケージ側が未対応の場合、`package.json`の`overrides`で該当パッケージのバージョンを強制固定する（互換性リスクがあるため、固定後は該当機能の動作確認が必要）",
              "- 影響が深刻かつ代替手段が無い場合、該当パッケージの採用自体を見直す",
              "",
              `_このissueは自動更新されます（最終更新: ${new Date().toISOString()}）_`,
            ].join("\n");
            core.setOutput("body", body);

      - name: トラッキングissueを同期する
        uses: ./.dev-standards-actions/.github/actions/tracking-issue-sync
        with:
          title: ${{ inputs.tracking_issue_title }}
          has-findings: ${{ steps.scan.outputs.has_vulnerabilities }}
          body: ${{ steps.body.outputs.body }}
          labels: ${{ inputs.tracking_issue_labels }}
          close-comment: "再スキャンの結果、既知の脆弱性が検知されなくなったため自動クローズします。"
          github-token: ${{ github.token }}

      # issue #1308。「CVEを確実に検知する」側の仕組み（#1288・#1292）は強化してきた
      # 一方、検知後どれくらいの時間で解消されているか（対応時間、MTTR）が見えない
      # ままだった。トラッキングissue（上記）は検知内容が変わるたびに本文が上書き
      # される構造のため、個々の脆弱性がいつ検知・いつ解消されたかの時系列情報が
      # どこにも残らない。台帳ファイル（docs/generated/配下、永続化）で
      # name+version単位の初回検知日時を追跡し、スキャン結果から消えた
      # （＝解消されたとみなす）タイミングでMTTR履歴へ追記する。
      - name: MTTR台帳・履歴を更新する
        id: mttr
        run: |
          node -e '
            const fs = require("fs");
            const { updateLedger, summarizeMttr } = require("./.dev-standards-actions/scripts/dependency-mttr-tracker.js");

            const findings = "${{ steps.scan.outputs.has_vulnerabilities }}" === "true"
              ? JSON.parse(fs.readFileSync("/tmp/full-scan-result.json", "utf-8"))
              : [];

            const ledgerPath = "docs/generated/dependency-vulnerability-mttr-ledger.json";
            const historyPath = "docs/generated/dependency-vulnerability-mttr-history.json";
            const ledger = fs.existsSync(ledgerPath) ? JSON.parse(fs.readFileSync(ledgerPath, "utf-8")) : [];
            const history = fs.existsSync(historyPath) ? JSON.parse(fs.readFileSync(historyPath, "utf-8")) : [];

            const now = new Date().toISOString();
            const { ledger: nextLedger, resolved } = updateLedger(ledger, findings, now);
            const nextHistory = [...history, ...resolved];

            fs.mkdirSync("docs/generated", { recursive: true });
            fs.writeFileSync(ledgerPath, `${JSON.stringify(nextLedger, null, 2)}\n`);
            fs.writeFileSync(historyPath, `${JSON.stringify(nextHistory, null, 2)}\n`);

            const thirtyDaysAgo = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
            const summary = summarizeMttr(nextHistory, thirtyDaysAgo);
            fs.writeFileSync("/tmp/mttr-summary.json", JSON.stringify(summary));
          '

      - name: MTTR台帳・履歴をcommit-via-pr経由でコミットする
        uses: ./.dev-standards-actions/.github/actions/commit-via-pr
        with:
          paths: docs/generated/dependency-vulnerability-mttr-ledger.json docs/generated/dependency-vulnerability-mttr-history.json
          commit-subject: "chore(security): 依存パッケージ脆弱性のMTTR台帳を更新する [skip ci]"
          branch-prefix: chore/dependency-mttr

      # dev-standards#1149: 検知結果の詳細（パッケージ名・バージョン・直接/間接・
      # 脆弱性ID・Severity）は従来トラッキングissueの本文にのみ書き込んでおり、
      # Job Summary・ジョブログには件数のみしか出していなかった。issueタブへの
      # 遷移無しでも確認できるよう、同じ詳細表をJob Summary・標準出力の両方へ出す。
      # `tee`で両方に書くのは、sandbox-unreachable-investigation Skillの既知の知見
      # （Job Summaryの内容はAPI経由で取得できないため、ジョブログにも同じ内容を
      # 出しておく）と同じ理由
      - name: 概要を出力する
        if: always()
        run: |
          set -eu
          node -e '
            const fs = require("fs");
            let body = "## 依存パッケージ既知脆弱性スキャン 実行結果\n\n";
            const hasVulnerabilities = "${{ steps.scan.outputs.has_vulnerabilities }}" === "true";
            if (!hasVulnerabilities) {
              body += "既知の脆弱性は検知されませんでした。\n";
            } else {
              const findings = JSON.parse(fs.readFileSync("/tmp/full-scan-result-with-pr.json", "utf-8"));
              body += `検知件数: ${findings.length}件\n\n`;
              body += "| パッケージ | バージョン | 直接/間接 | 脆弱性ID | Severity | 対応PR |\n";
              body += "|---|---|---|---|---|---|\n";
              for (const f of findings) {
                const ids = f.vulnerabilities.map((v) => v.id).join(", ");
                const severity = f.vulnerabilities.map((v) => v.severityRating).filter(Boolean).join(", ") || "不明";
                const relatedPr = f.relatedPr ? `#${f.relatedPr.number}` : "（無し）";
                body += `| ${f.name} | ${f.version} | ${f.direct ? "直接" : "間接"} | ${ids} | ${severity} | ${relatedPr} |\n`;
              }
            }

            // issue #1308。検知はできているが、実際にどれくらいの時間で解消されて
            // いるか（MTTR）がここまで見えなかった。直近30日間に解消された脆弱性の
            // 件数・平均対応日数を常に表示する（該当0件の場合も、集計自体が
            // 行われたことが分かるようその旨を明示する）
            if (fs.existsSync("/tmp/mttr-summary.json")) {
              const mttr = JSON.parse(fs.readFileSync("/tmp/mttr-summary.json", "utf-8"));
              body += "\n### 直近30日のMTTR（対応時間）\n\n";
              if (mttr.count === 0) {
                body += "直近30日間に解消された脆弱性はありません。\n";
              } else {
                body += `解消件数: ${mttr.count}件、平均対応日数: ${mttr.averageMttrDays.toFixed(1)}日\n`;
              }
            }
            fs.writeFileSync("/tmp/full-scan-summary.md", body);
          '
          tee -a "$GITHUB_STEP_SUMMARY" < /tmp/full-scan-summary.md
