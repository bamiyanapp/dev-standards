name: 依存パッケージの定期脆弱性スキャン

# issue #1095。既存のdependency-risk-summary job（reusable-ci.yml）は、PRの
# package-lock.json差分に対してのみ動作するため、Renovateが更新PRを出さない限り
# 一度も実行されない。間接依存は親パッケージのバージョン範囲内で解決されるため、
# 親パッケージ自体がrange外の新しいバージョンを必要とする脆弱性修正を取り込めない
# 場合、Renovateは通常検知できない。このワークフローは、Renovateの提案可否に依存
# しない独立したセーフティネットとして、mainブランチのpackage-lock.jsonを対象に
# 定期的な脆弱性スキャンを行う

on:
  schedule:
    # UTC 3:17（JST 12:17頃）。同時刻に多数のリポジトリが実行されがちな00分・30分を
    # 避け、GitHub Actions側の負荷分散に配慮する（他の定期実行ジョブと同じ方針）
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: "依存パッケージの既知脆弱性スキャン"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: チェックアウトする
        uses: actions/checkout@v7

      - name: Node.jsをセットアップする
        uses: actions/setup-node@v7
        with:
          # reusable-ci.ymlの他jobと合わせ、具体的なメジャーバージョン番号へ固定する
          # （setup-nodeのバージョンマニフェスト取得の一時的な失敗を避けるための既存方針）
          node-version: "24"

      - name: package-lock.jsonをスキャンする
        id: scan
        run: node scripts/dependency-full-scan.js package-lock.json > /tmp/full-scan-result.json

      - name: 検知結果をIssueへ反映する
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const findings = JSON.parse(fs.readFileSync('/tmp/full-scan-result.json', 'utf-8'));

            // issue #1095: 定期実行ごとに新規Issueを積み重ねるのではなく、固定タイトルの
            // 単一Issueをダッシュボードとして使う（Renovateの「Dependency Dashboard」と
            // 同じ考え方）。検知が無くなった場合もその旨を本文に反映し、Issueはクローズせず
            // 残す（検知の有無自体が履歴として追える）
            const ISSUE_TITLE = "[定期スキャン] 依存パッケージの既知脆弱性検知（mainブランチ）";

            let body;
            if (findings.length === 0) {
              body =
                `${ISSUE_TITLE}\n\n` +
                '現時点でmainブランチのpackage-lock.jsonに既知の脆弱性は見つかりませんでした（[OSV.dev](https://osv.dev)で確認）。\n\n' +
                `最終スキャン: ${new Date().toISOString()}\n`;
            } else {
              const rows = findings.map((f) => {
                const ids = f.vulnerabilities.map((v) => v.id).join(", ");
                const severity = f.vulnerabilities.map((v) => v.severityRating).filter(Boolean).join(", ") || "不明";
                return `| ${f.name} | ${f.version} | ${f.direct ? "直接" : "間接"} | ${ids} | ${severity} |`;
              });
              body =
                `${ISSUE_TITLE}\n\n` +
                'mainブランチのpackage-lock.jsonを対象にした定期スキャンで、以下のパッケージに既知の脆弱性が見つかりました。\n\n' +
                '| パッケージ | バージョン | 直接/間接 | 脆弱性ID | Severity |\n|---|---|---|---|---|\n' +
                rows.join('\n') + '\n\n' +
                '### 対応候補\n\n' +
                '- 親パッケージ（間接依存の場合）に、該当パッケージを取り込んだ新バージョンが出ていればそちらへ更新する\n' +
                '- 親パッケージ側が未対応の場合、`package.json`の`overrides`で該当パッケージのバージョンを強制固定する（互換性リスクがあるため、固定後は該当機能の動作確認が必要）\n' +
                '- 影響が深刻かつ代替手段が無い場合、該当パッケージの採用自体を見直す\n\n' +
                `最終スキャン: ${new Date().toISOString()}\n`;
            }

            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${ISSUE_TITLE}"`,
            });
            const existingIssue = existing.data.items.find((i) => i.title === ISSUE_TITLE);

            if (!existingIssue) {
              if (findings.length === 0) {
                // 検知が無い初回実行ではIssueを作らない（起票するのは「対応が必要になった時」のみ）
                return;
              }
              const severityRatings = findings.flatMap((f) => f.vulnerabilities.map((v) => v.severityRating));
              const labelName = severityRatings.includes('CRITICAL') || severityRatings.includes('HIGH')
                ? 'priority: high'
                : severityRatings.includes('MEDIUM') ? 'priority: medium' : 'priority: low';
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: ISSUE_TITLE,
                body,
                labels: ['bug', labelName],
              });
              core.info(`Issue #${created.data.number} を作成しました`);
              return;
            }

            if (existingIssue.state !== 'open' && findings.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                state: 'open',
              });
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existingIssue.number,
              body,
            });
            core.info(`Issue #${existingIssue.number} を更新しました`);
