# 目的: endoflife.date の API の応答の形を確認する（AWS Lambda のランタイムのサポート終了日）。
# 対応するissue: dev-standards#1371
# 作成日: 2026-11-20
# 確認が終わったら、このファイルは削除する（tmp-* は、14日を超えて残ると警告される）。
name: tmp-probe-endoflife-api

on:
  push:
    branches: [claude/dev-efficiency-improvements-6wlv2c]
    paths: [".github/workflows/tmp-probe-endoflife-api.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: APIの応答の形を確認する
        run: |
          {
            for url in \
              "https://endoflife.date/api/aws-lambda.json" \
              "https://endoflife.date/api/v1/products/aws-lambda/" ; do
              echo "### $url"
              code=$(curl -sS -o /tmp/body.json -w '%{http_code}' -H 'Accept: application/json' "$url" || echo "curl-failed")
              echo "HTTP: $code"
              echo "--- 先頭800文字"
              head -c 800 /tmp/body.json; echo
              echo "--- nodejs を含む行（サイクル名・終了日の候補）"
              jq -c '[.. | objects | select((.cycle? // .name? // "" | tostring | test("nodejs")))][0:12]' /tmp/body.json 2>/dev/null | head -c 2500
              echo
              echo "--- 最上位のキー"
              jq -c 'if type=="array" then (.[0]|keys) else keys end' /tmp/body.json 2>/dev/null
              echo
            done
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
