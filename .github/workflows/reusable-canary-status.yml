name: Reusable Canary Status

# issue #1196（#1199、Task 1）。karutaのcanary-status.yml（issue #1462等）を
# 一般化したもの。CloudFront KVS・CloudFormationスタックの状態（重み・
# ロールバック状態・キュー待ち・最終更新時刻・昇格予定日時）は、AWS CLIで
# 見るしかなくPR・CIのログからは掴めない。デプロイは一切行わない状態確認
# 専用のworkflow（workflow_call）である。
#
# Task 1（#1199）でKVS読み取り・CloudFormationスタックの状態取得・Job Summary
# 出力を、Task 2（#1200）でbackend/frontendの配信中バージョン表示を実装した。
# 本Task（#1201）では、キューイング中・反映済みのPR一覧算出を追加する。
# docs/generated/への反映・force_stable放置検知・直近実行取得（#1202）は
# 後続Taskで追加する。
#
# 猶予期間の判定は、専用のタイムスタンプ管理を新設せず、backendのcanary
# CloudFormationスタックのLastUpdatedTime（未更新の場合はCreationTime）を
# そのまま使う（reusable-promote-canary.ymlと同じ方式）。
#
# backend URLの解決は、reusable-promote-canary.ymlと同じ分離方針を取る。
# このworkflow自体はosls等のデプロイツールチェインに依存させず、呼び出し元が
# resolve-serverless-backend-url複合action等であらかじめ解決した結果を
# canary_backend_url/stable_backend_urlとして渡す。これにより、本workflowは
# checkout・Node.jsセットアップ・npm ciが不要（curlとubuntu-latestランナー
# 標準搭載のnodeのみで完結する）な軽量な構成を保てる

on:
  workflow_call:
    inputs:
      canary_stack_name:
        description: "backend canaryのCloudFormationスタック名。"
        type: string
        required: true
      stable_stack_name:
        description: "backend stableのCloudFormationスタック名。"
        type: string
        required: true
      kvs_arn:
        description: "canary_weight・force_stable・canary_queue_pendingを保持するCloudFront KeyValueStoreのARN。"
        type: string
        required: true
      grace_period_hours:
        description: "canaryデプロイからこの時間数が経過し、かつforce_stableが設定されていなければ昇格対象とする（reusable-promote-canary.ymlのgrace_period_hoursと同じ値を指定すること）。"
        type: number
        default: 20
      aws_region:
        description: "CloudFormationスタックが存在するAWSリージョン。"
        type: string
        default: "ap-northeast-1"
      kvs_region:
        description: "KVS操作APIが存在するAWSリージョン。"
        type: string
        default: "us-east-1"
      canary_backend_url:
        description: "canary backendのベースURL（末尾スラッシュ無し）。`/get-version`エンドポイントを持つこと。呼び出し元があらかじめ解決する（例: resolve-serverless-backend-url複合action）。省略時（既定の空文字列）はbackendバージョンの表示を省略する。"
        type: string
        default: ""
      stable_backend_url:
        description: "stable backendの同上URL。"
        type: string
        default: ""
      frontend_domain:
        description: "frontendの`version.json`を配信するドメイン（例: example.cloudfront.net）。省略時（既定の空文字列）はfrontendバージョンの表示を省略する。"
        type: string
        default: ""
      canary_frontend_version_path:
        description: "frontend版canaryのversion.jsonパス（frontend_domainからの相対パス、先頭スラッシュ有り）。"
        type: string
        default: "/canary/version.json"
      stable_frontend_version_path:
        description: "frontend版stableのversion.jsonパス（frontend_domainからの相対パス、先頭スラッシュ有り）。"
        type: string
        default: "/stable/version.json"
      release_type_regex:
        description: >-
          「キューイング中の変更」「canaryに反映済み・stable昇格待ちの変更」のPR一覧へ
          含めるコミット種別（conventional commits、`.releaserc.cjs`のreleaseRules）を
          判定する正規表現。semantic-releaseが新バージョンを発行しない種類
          （chore・docs等）を一覧から除外するために使う（karuta issue #1622相当）。
        type: string
        default: '^(feat|fix|refactor)(\(|!|:)'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

jobs:
  status:
    name: "運用状態を可視化する"
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
    steps:
      # issue #1201。「キューイング中の変更」「canaryに反映済み・stable昇格待ちの
      # 変更」のPR一覧算出にgit logのrangeを使うため、全履歴が必要
      - name: チェックアウトする
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: KVSの値を取得する
        id: kvs
        run: |
          set -eu
          CANARY_WEIGHT=$(aws cloudfront-keyvaluestore get-key --region "${{ inputs.kvs_region }}" --kvs-arn "${{ inputs.kvs_arn }}" --key "canary_weight" --query Value --output text 2>/dev/null || echo "（未設定）")
          FORCE_STABLE=$(aws cloudfront-keyvaluestore get-key --region "${{ inputs.kvs_region }}" --kvs-arn "${{ inputs.kvs_arn }}" --key "force_stable" --query Value --output text 2>/dev/null || echo "false")
          PENDING=$(aws cloudfront-keyvaluestore get-key --region "${{ inputs.kvs_region }}" --kvs-arn "${{ inputs.kvs_arn }}" --key "canary_queue_pending" --query Value --output text 2>/dev/null || echo "false")
          echo "canary_weight=${CANARY_WEIGHT}" >> "$GITHUB_OUTPUT"
          echo "force_stable=${FORCE_STABLE}" >> "$GITHUB_OUTPUT"
          echo "canary_queue_pending=${PENDING}" >> "$GITHUB_OUTPUT"

      - name: canary/stableスタックの状態を取得する
        id: status
        run: |
          set -eu
          GRACE_PERIOD_HOURS="${{ inputs.grace_period_hours }}"

          if aws cloudformation describe-stacks --stack-name "${{ inputs.stable_stack_name }}" >/dev/null 2>&1; then
            STABLE_LAST_UPDATED=$(aws cloudformation describe-stacks --stack-name "${{ inputs.stable_stack_name }}" --query "Stacks[0].LastUpdatedTime" --output text)
            if [ "$STABLE_LAST_UPDATED" = "None" ]; then
              STABLE_LAST_UPDATED=$(aws cloudformation describe-stacks --stack-name "${{ inputs.stable_stack_name }}" --query "Stacks[0].CreationTime" --output text)
            fi
            echo "stable_last_updated=$(TZ=Asia/Tokyo date -d "$STABLE_LAST_UPDATED" +"%Y-%m-%d %H:%M:%S JST")" >> "$GITHUB_OUTPUT"
          else
            echo "stable_last_updated=" >> "$GITHUB_OUTPUT"
          fi

          if ! aws cloudformation describe-stacks --stack-name "${{ inputs.canary_stack_name }}" >/dev/null 2>&1; then
            echo "canary_exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "canary_exists=true" >> "$GITHUB_OUTPUT"

          LAST_UPDATED=$(aws cloudformation describe-stacks --stack-name "${{ inputs.canary_stack_name }}" --query "Stacks[0].LastUpdatedTime" --output text)
          if [ "$LAST_UPDATED" = "None" ]; then
            LAST_UPDATED=$(aws cloudformation describe-stacks --stack-name "${{ inputs.canary_stack_name }}" --query "Stacks[0].CreationTime" --output text)
          fi
          LAST_UPDATED_EPOCH=$(date -d "$LAST_UPDATED" +%s)
          echo "canary_last_updated=$(TZ=Asia/Tokyo date -d "@${LAST_UPDATED_EPOCH}" +"%Y-%m-%d %H:%M:%S JST")" >> "$GITHUB_OUTPUT"

          ELIGIBLE_EPOCH=$(( LAST_UPDATED_EPOCH + GRACE_PERIOD_HOURS * 3600 ))
          ELIGIBLE_AT=$(TZ=Asia/Tokyo date -d "@${ELIGIBLE_EPOCH}" +"%Y-%m-%d %H:%M:%S JST")
          echo "promotion_eligible_at=${ELIGIBLE_AT}" >> "$GITHUB_OUTPUT"

          # issue #1475・#1622相当。canaryの最終更新以降にmainへマージされたPR
          # （キューイング中の変更）をリンクで示す。squash mergeのコミット件名末尾に
          # 付くGitHub標準の"(#1234)"形式を持つ件名のみを対象とする
          pr_link() {
            local subject="$1"
            local num title
            num=$(echo "$subject" | grep -oE '#[0-9]+\)$' | tr -d '#)')
            title=$(echo "$subject" | sed -E 's/ *\(#[0-9]+\)$//')
            echo "- [#${num} ${title}](https://github.com/${{ github.repository }}/pull/${num})"
          }
          QUEUED_PR_SUBJECTS=$(git log --since="$LAST_UPDATED" --pretty=format:'%s' | grep -E '\(#[0-9]+\)$' | grep -iE "${{ inputs.release_type_regex }}" | awk '!seen[$0]++')
          {
            echo "queued_pr_links<<PR_LINKS_EOF"
            if [ -n "$QUEUED_PR_SUBJECTS" ]; then
              while IFS= read -r subject; do
                pr_link "$subject"
              done <<< "$QUEUED_PR_SUBJECTS"
            else
              echo "（該当するPRが見つからなかった）"
            fi
            echo "PR_LINKS_EOF"
          } >> "$GITHUB_OUTPUT"

      # issue #1523・#1565相当。各stageのbackend/frontendが実際に配信している
      # バージョンを取得する。canary_backend_url・frontend_domainのいずれも
      # 省略された場合は何も取得しない（呼び出し元がbackend/frontendを持たない
      # 構成の可能性があるため、必須にしない）。疎通不可の場合もエラーにせず
      # 「取得できなかった」と表示する
      - name: canary/stableの配信中バージョンを取得する
        id: version
        if: inputs.canary_backend_url != '' || inputs.frontend_domain != ''
        run: |
          set -eu
          fetch_backend_version() {
            local url="$1"
            if [ -z "$url" ]; then
              echo "（未設定）"
              return
            fi
            local body
            if ! body=$(curl -fsS --max-time 10 "${url}/get-version" 2>/dev/null); then
              echo "（取得できなかった）"
              return
            fi
            echo "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).version||'（取得できなかった）')}catch{console.log('（取得できなかった）')}})"
          }
          fetch_frontend_version() {
            local url="$1"
            if [ -z "$url" ]; then
              echo "（未設定）"
              return
            fi
            local body
            if ! body=$(curl -fsS --max-time 10 "$url" 2>/dev/null); then
              echo "（取得できなかった）"
              return
            fi
            echo "$body" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).version||'（取得できなかった）')}catch{console.log('（取得できなかった）')}})"
          }
          combine_version() {
            local backend="$1"
            local frontend="$2"
            if [ "$backend" = "$frontend" ]; then
              echo "$backend"
            else
              echo "⚠️ 不一致（backend: ${backend} / frontend: ${frontend}）"
            fi
          }

          CANARY_BACKEND_VERSION=$(fetch_backend_version "${{ inputs.canary_backend_url }}")
          STABLE_BACKEND_VERSION=$(fetch_backend_version "${{ inputs.stable_backend_url }}")

          FRONTEND_DOMAIN="${{ inputs.frontend_domain }}"
          if [ -n "$FRONTEND_DOMAIN" ]; then
            CANARY_FRONTEND_VERSION=$(fetch_frontend_version "https://${FRONTEND_DOMAIN}${{ inputs.canary_frontend_version_path }}")
            STABLE_FRONTEND_VERSION=$(fetch_frontend_version "https://${FRONTEND_DOMAIN}${{ inputs.stable_frontend_version_path }}")
          else
            CANARY_FRONTEND_VERSION="（未設定）"
            STABLE_FRONTEND_VERSION="（未設定）"
          fi

          echo "canary_version=$(combine_version "$CANARY_BACKEND_VERSION" "$CANARY_FRONTEND_VERSION")" >> "$GITHUB_OUTPUT"
          echo "stable_version=$(combine_version "$STABLE_BACKEND_VERSION" "$STABLE_FRONTEND_VERSION")" >> "$GITHUB_OUTPUT"

      # issue #1478・#1791相当。「canaryには反映済みだがstableへはまだ昇格して
      # いない」PRを区別して示す。実際にデプロイされているバージョン（配信中
      # バージョン取得stepで取得済みのgitタグ、vX.Y.Z形式）同士のgit log rangeで
      # 算出する。バージョンが取得できなかった・不一致警告等でタグが解決できない
      # 場合は、従来のタイムスタンプ区間方式へフォールバックする
      - name: canaryに反映済み・stable昇格待ちの変更を算出する
        id: changes
        if: steps.status.outputs.canary_exists == 'true'
        run: |
          set -eu
          pr_link() {
            local subject="$1"
            local num title
            num=$(echo "$subject" | grep -oE '#[0-9]+\)$' | tr -d '#)')
            title=$(echo "$subject" | sed -E 's/ *\(#[0-9]+\)$//')
            echo "- [#${num} ${title}](https://github.com/${{ github.repository }}/pull/${num})"
          }
          render_links() {
            local subjects="$1"
            if [ -n "$subjects" ]; then
              while IFS= read -r subject; do
                pr_link "$subject"
              done <<< "$subjects"
            else
              echo "（該当するPRが見つからなかった）"
            fi
          }

          CANARY_VERSION="${{ steps.version.outputs.canary_version }}"
          STABLE_VERSION="${{ steps.version.outputs.stable_version }}"
          SEMVER_REGEX='^[0-9]+\.[0-9]+\.[0-9]+$'
          CANARY_TAG="v${CANARY_VERSION}"
          STABLE_TAG="v${STABLE_VERSION}"

          IN_CANARY_PR_SUBJECTS=""
          if [[ "$CANARY_VERSION" =~ $SEMVER_REGEX ]] && [[ "$STABLE_VERSION" =~ $SEMVER_REGEX ]] \
            && git rev-parse -q --verify "refs/tags/${CANARY_TAG}" >/dev/null \
            && git rev-parse -q --verify "refs/tags/${STABLE_TAG}" >/dev/null; then
            if [ "$STABLE_VERSION" != "$CANARY_VERSION" ]; then
              IN_CANARY_PR_SUBJECTS=$(git log "${STABLE_TAG}..${CANARY_TAG}" --pretty=format:'%s' | grep -E '\(#[0-9]+\)$' | grep -iE "${{ inputs.release_type_regex }}" | awk '!seen[$0]++')
            fi
          elif [ -n "${{ steps.status.outputs.stable_last_updated }}" ]; then
            STABLE_LAST_UPDATED_EPOCH=$(date -d "${{ steps.status.outputs.stable_last_updated }}" +%s)
            CANARY_LAST_UPDATED_EPOCH=$(date -d "${{ steps.status.outputs.canary_last_updated }}" +%s)
            if [ "$STABLE_LAST_UPDATED_EPOCH" -le "$CANARY_LAST_UPDATED_EPOCH" ]; then
              IN_CANARY_PR_SUBJECTS=$(git log --since="${{ steps.status.outputs.stable_last_updated }}" --until="${{ steps.status.outputs.canary_last_updated }}" --pretty=format:'%s' | grep -E '\(#[0-9]+\)$' | grep -iE "${{ inputs.release_type_regex }}" | awk '!seen[$0]++')
            fi
          fi
          {
            echo "in_canary_pr_links<<IN_CANARY_LINKS_EOF"
            render_links "$IN_CANARY_PR_SUBJECTS"
            echo "IN_CANARY_LINKS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 概要を出力する
        if: always()
        run: |
          set -eu
          {
            echo "## canary運用状態"
            echo ""
            echo "| 項目 | 値 |"
            echo "|---|---|"
            echo "| canary_weight（canaryへ振り分ける割合） | ${{ steps.kvs.outputs.canary_weight }}% |"
            echo "| force_stable（管理者ロールバック中か） | ${{ steps.kvs.outputs.force_stable }} |"
            echo "| canary_queue_pending（反映待ちのマージがあるか） | ${{ steps.kvs.outputs.canary_queue_pending }} |"
            echo "| canaryスタックが存在するか | ${{ steps.status.outputs.canary_exists }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.status.outputs.canary_exists }}" = "true" ]; then
            {
              echo "| stableの最終更新 | ${{ steps.status.outputs.stable_last_updated || '（stableスタックが存在しない）' }} |"
              echo "| canaryの最終更新 | ${{ steps.status.outputs.canary_last_updated }} |"
              echo "| 本番昇格の条件を満たす日時（この日時を過ぎたら昇格対象） | ${{ steps.status.outputs.promotion_eligible_at }}以降 |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ steps.version.outputs.stable_version }}" ]; then
            {
              echo "| stableの配信中バージョン | ${{ steps.version.outputs.stable_version }} |"
              echo "| canaryの配信中バージョン | ${{ steps.version.outputs.canary_version }} |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.status.outputs.canary_exists }}" = "true" ]; then
            {
              echo ""
              echo "### canaryに反映済み・stable昇格待ちの変更"
              echo ""
              echo "${{ steps.changes.outputs.in_canary_pr_links }}"
              echo ""
              echo "### キューイング中の変更（canaryにも未反映・canary最終更新以降にmainへマージされたPR）"
              echo ""
              echo "${{ steps.status.outputs.queued_pr_links }}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
