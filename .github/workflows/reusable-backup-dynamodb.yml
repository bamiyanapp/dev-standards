name: Reusable Backup DynamoDB

# issue #726。karuta issue #1320（ブルーグリーンデプロイ導入のデータ層移管）向けに
# karuta側へ実装した「手動実行でDynamoDBテーブルのオンデマンドバックアップを取得する」
# ワークフロー（bamiyanapp/karuta#1337）を一般化したもの。移管・スキーマ変更等の
# 構成変更作業の前に、いつでもこのワークフローを手動実行して明示的なタイミングの
# バックアップを取得できる。PITR（有効な場合）は過去の任意の時点への復旧用で常時
# 有効だが、本ワークフローは「このタイミングの状態を明示的に残す」ための追加の保険
# として使う想定。
#
# テーブル名リストはinputsで受け取る。参照側（karuta等）はこのワークフローを
# 呼ぶ薄いワークフローのみを書けばよい（.github/workflows/backup-dynamodb.yml参照）。
# AWS認証情報は既存のreusable-cd.ymlやdeploy-serverless複合actionと同じ方式
# （secretsとして渡す）に合わせる。

on:
  workflow_call:
    inputs:
      table_names:
        description: "バックアップ対象のDynamoDBテーブル名をJSON配列形式で指定する（例: '[\"my-table-a\", \"my-table-b\"]'）。"
        type: string
        required: true
      aws_region:
        description: "テーブルが存在するAWSリージョン。"
        type: string
        default: "ap-northeast-1"
      role_to_assume:
        description: >-
          OIDCで引き受けるIAMロールのARN（issue #1582）。指定すると、アクセスキーを使わず、一時クレデンシャルで認証する。
          呼び出し側のjobに`permissions: id-token: write`が必要（このworkflowは`permissions`を宣言せず、
          呼び出し側の権限を引き継ぐため、未指定のときは、`id-token`権限は要らない）
        type: string
        default: ""
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

jobs:
  backup:
    name: "DynamoDBバックアップ"
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ inputs.aws_region }}
    steps:
      - name: AWSの認証情報の指定を検証する
        env:
          ROLE_TO_ASSUME: ${{ inputs.role_to_assume }}
        run: |
          if [ -n "$ROLE_TO_ASSUME" ]; then
            if [ -n "$AWS_ACCESS_KEY_ID" ] || [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
              echo "::warning::role_to_assume とアクセスキーの両方が指定されています。OIDCを優先し、アクセスキーは使いません。アクセスキーの指定は削除してください。"
            fi
          elif [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::AWSの認証情報がありません。role_to_assume（OIDC）か、secretsのAWS_ACCESS_KEY_IDとAWS_SECRET_ACCESS_KEYのどちらかを指定してください。"
            exit 1
          fi
      # configure-aws-credentialsが書く一時クレデンシャルは、GITHUB_ENV経由で、jobのenvの（空の）
      # アクセスキーを上書きする（実機で確認: GITHUB_ENVの値が、jobのenvより優先される）
      - name: OIDCでAWSの一時クレデンシャルを取得する
        if: inputs.role_to_assume != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}
      - name: オンデマンドバックアップを作成する
        env:
          TABLE_NAMES_JSON: ${{ inputs.table_names }}
        run: |
          set -u

          readarray -t TABLES < <(echo "$TABLE_NAMES_JSON" | jq -r '.[]')

          TIMESTAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          FAILED=0

          echo "## DynamoDB バックアップ結果 (${TIMESTAMP})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| テーブル | 結果 | Backup ARN |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          for TABLE in "${TABLES[@]}"; do
            BACKUP_NAME="${TABLE}-manual-${TIMESTAMP}"
            if RESULT=$(aws dynamodb create-backup \
              --table-name "$TABLE" \
              --backup-name "$BACKUP_NAME" \
              --output json 2>&1); then
              ARN=$(echo "$RESULT" | jq -r '.BackupDetails.BackupArn')
              echo "✅ ${TABLE}: ${ARN}"
              echo "| ${TABLE} | ✅ 成功 | \`${ARN}\` |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ ${TABLE}: ${RESULT}" >&2
              echo "| ${TABLE} | ❌ 失敗 | ${RESULT} |" >> "$GITHUB_STEP_SUMMARY"
              FAILED=1
            fi
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "オンデマンドバックアップはPITRと異なり自動削除されないため、不要になったら手動で削除すること。" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -ne 0 ]; then
            echo "一部のテーブルでバックアップに失敗した。上記サマリーを確認すること" >&2
            exit 1
          fi
