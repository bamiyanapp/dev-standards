name: Reusable Dependency Deprecation Scan

# issue #969（#945で追加したdeprecated検知の限界への対応）。
# dependency-risk-summary job（reusable-ci.yml）のdeprecated検知（dependency-
# deprecation-info.js、issue #945）は、更新PR（package-lock.jsonの変更）が
# 存在する場合にのみ動作する。しかし、aws-sdk（v2系）のように後継バージョン自体が
# 存在しないまま非推奨化されたパッケージは、Renovateが更新PRを作らないため
# 一度も評価されない（karuta#1656・#1658）。
#
# 本ワークフローは更新PRの有無に関わらず、呼び出し元リポジトリで現時点で
# ロックされている依存パッケージ全体をスケジュール実行等で定期的にスキャンし、
# 検知結果をトラッキング用issueへ反映する（新規作成、または既存issueの本文更新）。
#
# karuta/promote-canary.yml等と同様、scheduleトリガー自体は呼び出し元リポジトリの
# workflowが持つ（reusable workflow自身はworkflow_callのみ）。

on:
  workflow_call:
    inputs:
      lockfile_path:
        description: "スキャン対象のpackage-lock.jsonのパス（リポジトリルート相対）。"
        type: string
        default: "package-lock.json"
      direct_only:
        description: "trueの場合、直接依存のみを対象とする（既定）。transitive依存まで含めると、呼び出し元が自力でアップグレードできないパッケージまで通知してしまうため"
        type: boolean
        default: true
      tracking_issue_title:
        description: "検知結果を反映するissueのタイトル。同名のopen issueが既にあれば本文を更新し、無ければ新規作成する。"
        type: string
        default: "[自動] 依存パッケージのdeprecated（サポート終了）検知"
      tracking_issue_labels:
        description: "トラッキングissue作成時に付与するラベル（JSON配列文字列）。issue駆動の原則（CLAUDE.md）に従い、型・重要度ラベルを呼び出し元で指定すること。"
        type: string
        default: '["bug", "priority: medium"]'
      self_ref:
        description: >-
          呼び出し元が本workflowを`uses: bamiyanapp/dev-standards/.github/workflows/reusable-dependency-deprecation-scan.yml@<ref>`
          で参照した際の`<ref>`と同じ値（タグ・ブランチ・コミットSHA）を指定する必須入力。
          本workflow内でdev-standards自身のスクリプト（scripts/dependency-deprecation-scan.js）を
          ローカルチェックアウトする際に使う（dev-standards#1144、issue #1071と同種の問題）。
          `github.workflow_ref`では動的解決できないため、reusable-ci.ymlと同じ方式で
          呼び出し元に明示的な入力として渡してもらう
        type: string
        required: true
    outputs:
      has_deprecated:
        description: "deprecatedなパッケージが1件以上検知されたか。"
        value: ${{ jobs.scan.outputs.has_deprecated }}

permissions:
  contents: read

jobs:
  scan:
    name: "依存deprecatedスキャン"
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      has_deprecated: ${{ steps.scan.outputs.has_deprecated }}
    steps:
      - name: チェックアウトする
        uses: actions/checkout@v7

      - name: Node.jsをセットアップする
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # scripts/dependency-deprecation-scan.jsはdev-standards自身のスクリプトのため、
      # 参照側リポジトリ（karuta等）では別途チェックアウトする必要がある
      # （「reusable workflow参照のバージョン固定」docs/cicd-pipeline-specification.md参照）。
      # refはハードコードせず、呼び出し元から渡されるself_ref（本workflow自身が
      # 呼び出された際のref）を使う（dev-standards#1144）。ハードコードする方式は
      # 過去に2度問題を起こしている（初版v2.83.0固定でのMODULE_NOT_FOUND、
      # karuta#1693）・（v2.85.0固定のまま更新が追従せずOSV API不具合修正が
      # 反映されなかった件、dev-standards#1144）ため、根本的にハードコード自体を
      # やめる
      - name: dev-standardsをチェックアウトする（ローカルスクリプト用）
        uses: actions/checkout@v7
        with:
          repository: bamiyanapp/dev-standards
          ref: ${{ inputs.self_ref }}
          path: .dev-standards-actions

      - name: deprecatedな依存パッケージをスキャンする
        id: scan
        run: node .dev-standards-actions/scripts/dependency-deprecation-scan.js "${{ inputs.lockfile_path }}" "${{ inputs.direct_only }}" > /tmp/deprecation-scan.json

      # issue #1172。issue検索・作成/更新/クローズの制御フロー自体は
      # reusable-dependency-full-scan.yml・reusable-runtime-version-scan.ymlと
      # 完全に同一のため、共通action（tracking-issue-sync）へ切り出した。
      # 本文組み立て（表の列・文言）のみ、ここで呼び出し元として行う
      - name: Issue本文を組み立てる
        id: body
        if: steps.scan.outputs.has_deprecated == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const deprecated = JSON.parse(fs.readFileSync("/tmp/deprecation-scan.json", "utf-8"));
            const rows = deprecated.map((d) => `| ${d.name} | ${d.version} | ${d.deprecated} |`).join("\n");
            const body = [
              "npm registry上でdeprecated（非推奨）と判定されている依存パッケージが見つかりました。",
              "後継バージョンが存在しない（Renovate等が更新PRを作らない）ため、通常のRisk Summaryでは検知できません。",
              "",
              "| パッケージ | バージョン | deprecatedメッセージ |",
              "|---|---|---|",
              rows,
              "",
              "対応候補: 後継パッケージへの移行、または許容できるリスクとして明示的にクローズする。",
              "",
              `_このissueは自動更新されます（最終更新: ${new Date().toISOString()}）_`,
            ].join("\n");
            core.setOutput("body", body);

      - name: トラッキングissueを同期する
        uses: ./.dev-standards-actions/.github/actions/tracking-issue-sync
        with:
          title: ${{ inputs.tracking_issue_title }}
          has-findings: ${{ steps.scan.outputs.has_deprecated }}
          body: ${{ steps.body.outputs.body }}
          labels: ${{ inputs.tracking_issue_labels }}
          close-comment: "再スキャンの結果、deprecatedな依存パッケージが検知されなくなったため自動クローズします。"
          github-token: ${{ github.token }}

      - name: 概要を出力する
        if: always()
        run: |
          set -eu
          {
            echo "## 依存パッケージdeprecatedスキャン 実行結果"
            echo ""
            echo "検知件数: $([ "${{ steps.scan.outputs.has_deprecated }}" = "true" ] && echo "1件以上" || echo "0件")"
          } >> "$GITHUB_STEP_SUMMARY"
