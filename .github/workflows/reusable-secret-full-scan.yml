name: Reusable Secret Full History Scan

# issue #1307。既存のsecret-scan job（reusable-ci.yml）はPRのbase_branchとの
# 差分のみを対象にスキャンする。これは既存履歴に残る過去の誤検知で詰まるリスクを
# 避けるための設計判断だが、結果として「過去に誤ってコミットされ、既にmainへ
# マージ済みのシークレット」はPR差分スキャンの対象に一度も入らず検知できない
# ギャップが生まれる。
#
# 本ワークフローはリポジトリ全体の履歴を対象に定期スキャン（例: 週次）を行い、
# 検知結果をトラッキング用issueへ反映する（dependency-full-scan・
# dependency-deprecation-scan等と同じ設計に揃える）。
#
# karuta/promote-canary.yml等と同様、scheduleトリガー自体は呼び出し元リポジトリの
# workflowが持つ（reusable workflow自身はworkflow_callのみ）。

on:
  workflow_call:
    inputs:
      tracking_issue_title:
        description: "検知結果を反映するissueのタイトル。同名のopen issueが既にあれば本文を更新し、無ければ新規作成する。"
        type: string
        default: "[自動] シークレット遡及スキャン（定期スキャン）"
      tracking_issue_labels:
        description: "トラッキングissue作成時に付与するラベル（JSON配列文字列）。issue駆動の原則（CLAUDE.md）に従い、型・重要度ラベルを呼び出し元で指定すること。"
        type: string
        default: '["bug", "priority: high"]'
      self_ref:
        description: >-
          呼び出し元が本workflowを`uses: bamiyanapp/dev-standards/.github/workflows/reusable-secret-full-scan.yml@<ref>`
          で参照した際の`<ref>`と同じ値（タグ・ブランチ・コミットSHA）を指定する必須入力。
          本workflow内でdev-standards自身のcomposite action（tracking-issue-sync）を
          ローカルチェックアウトする際に使う（dev-standards#1144と同種の問題）。
        type: string
        required: true
    outputs:
      has_findings:
        description: "リポジトリ全体の履歴から1件以上のシークレットが検知されたか。"
        value: ${{ jobs.scan.outputs.has_findings }}

permissions:
  contents: read

jobs:
  scan:
    name: "シークレット遡及スキャン"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    env:
      # reusable-ci.ymlのsecret-scan jobと同じバージョン。Renovateのcustom regex
      # managerはreusable-ci.yml側のこの行のみを検知するため、本workflow側は
      # 手動で揃える必要がある（renovate.jsonのmanagerFilePatterns参照）
      GITLEAKS_VERSION: "8.30.1"
    outputs:
      has_findings: ${{ steps.gitleaks.outputs.has_findings }}
    steps:
      - name: チェックアウトする
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: dev-standardsをチェックアウトする（ローカルaction用）
        uses: actions/checkout@v7
        with:
          repository: bamiyanapp/dev-standards
          ref: ${{ inputs.self_ref }}
          path: .dev-standards-actions

      # reusable-ci.ymlのsecret-scan jobと同じ取得手順（issue #1268、
      # gitleaks/gitleaks-actionのv3商用ライセンス化を避けCLIバイナリを直接取得）
      - name: gitleaksをインストールする
        run: |
          set -eu
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o /tmp/gitleaks_checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          EXPECTED=$(grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" /tmp/gitleaks_checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum /tmp/gitleaks.tar.gz | awk '{print $1}')
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "gitleaksバイナリのチェックサムが一致しない（expected=$EXPECTED actual=$ACTUAL）" >&2
            exit 1
          fi
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks

      # --log-optsを指定せず、リポジトリ全体の履行を対象にスキャンする。
      # continue-on-errorにするのは、gitleaks detectは検知1件以上でexit 1を
      # 返すため、後続のissue同期ステップへ結果を渡すのにジョブ自体を失敗させない
      # ため（dependency-full-scan系と同じ設計）
      - name: gitleaksを実行する（リポジトリ全体）
        id: gitleaks
        continue-on-error: true
        run: |
          set -eu
          if gitleaks detect --redact -v --exit-code=1 --report-format json --report-path /tmp/gitleaks-report.json; then
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Issue本文を組み立てる
        id: body
        if: steps.gitleaks.outputs.has_findings == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const findings = JSON.parse(fs.readFileSync("/tmp/gitleaks-report.json", "utf-8"));
            const rows = findings.map((f) => {
              const file = f.File ?? "?";
              const commit = (f.Commit ?? "?").slice(0, 12);
              const rule = f.RuleID ?? "?";
              return `| ${file} | ${commit} | ${rule} |`;
            }).join("\n");
            const body = [
              "リポジトリ全体の履歴を対象にした定期スキャンで、シークレットの可能性がある文字列が見つかりました。",
              "",
              "シークレット本文自体はredact済みのためここには出力しない。各行のファイル・コミットを確認し、実際に機密情報であれば直ちに失効・再発行する（git履歴から消すだけでは不十分、過去に取得された可能性を前提に対応する）。",
              "",
              "| ファイル | コミット | ルール |",
              "|---|---|---|",
              rows,
              "",
              `_このissueは自動更新されます（最終更新: ${new Date().toISOString()}）_`,
            ].join("\n");
            fs.writeFileSync("/tmp/secret-full-scan-body.md", body);
          '
          {
            echo "body<<SECRET_SCAN_BODY_EOF"
            cat /tmp/secret-full-scan-body.md
            echo "SECRET_SCAN_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: トラッキングissueを同期する
        uses: ./.dev-standards-actions/.github/actions/tracking-issue-sync
        with:
          title: ${{ inputs.tracking_issue_title }}
          has-findings: ${{ steps.gitleaks.outputs.has_findings }}
          body: ${{ steps.body.outputs.body }}
          labels: ${{ inputs.tracking_issue_labels }}
          close-comment: "再スキャンの結果、シークレットが検知されなくなったため自動クローズします。"
          github-token: ${{ github.token }}

      - name: 概要を出力する
        if: always()
        run: |
          {
            echo "## シークレット遡及スキャン 実行結果"
            echo ""
            if [ "${{ steps.gitleaks.outputs.has_findings }}" = "true" ]; then
              echo "シークレットの可能性がある文字列が検知されました。詳細はトラッキングissueを確認してください。"
            else
              echo "リポジトリ全体の履歴から、シークレットは検知されませんでした。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
