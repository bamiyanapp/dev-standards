name: CI
run-name: >-
  CI (${{ github.event_name == 'pull_request' && 'PR' || 'push-to-main' }})
  ${{ github.event.head_commit.message || github.event.pull_request.title }}

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ci:
    # 自リポジトリのreusable-ci.ymlをdogfoodingする。相対パス参照のため、このPRで
    # 変更中のreusable-ci.yml自体の内容がそのまま使われる（@main参照ではない）。
    uses: ./.github/workflows/reusable-ci.yml
    with:
      # semantic-release本体・一部プラグインがNode 22以上を要求するため、
      # reusable-ci.ymlのnode_version既定値（20）ではpackage-lock.jsonの
      # 整合性検証（npm ci）でnpmのバージョン差異により失敗する。
      packages: '[{"dir":".","node_version":"22"}]'
      # issue bamiyanapp/karuta#824: dev-standards自身のArchitecture図もdogfoodingする
      # issue #580: 過去のmermaid化作業で登録漏れしていた各ドキュメントを追加
      enable_mermaid_render: true
      mermaid_doc_paths: "docs/cicd-pipeline-specification.md\ndocs/lambda-api-firebase-auth-pattern.md\ndocs/serverless-api-dynamodb-pattern.md\ndocs/ios-safari-audio-unlock-pattern.md\ndocs/oauth-csrf-nonce-pattern.md\ndocs/websocket-client-reconnect-pattern.md\ndocs/shared-ui-components.md\ndocs/short-lived-bearer-token-pattern.md\ndocs/deterministic-seed-id-pattern.md\ndocs/standard-tech-stack.md\ndocs/ops-monitoring-pattern.md\ndocs/serverless-static-site-pattern.md\ndocs/dependency-risk-judgment.md\n.claude/skills/git-workflow/SKILL.md"
      # issue #447: textlintの実行経路をtext-lint jobへ一本化する（従来はnpm test内の
      # lint:textスクリプトのみで実行しており、このjobは常にskippedと表示され紛らわしかった）
      enable_text_lint: true
      text_lint_paths: "docs/*.md\nREADME.md\nCLAUDE.md\n.claude/skills/**/*.md"
      # issue #586: CLAUDE.md・SKILL.md間の丸ごとコピペ重複（drift事故の原因）を検知する。
      # 実測値（0.13%、意図的なコード例2種の重複のみ）に対し8倍程度の余裕を持たせる
      enable_doc_duplication_check: true
      doc_duplication_threshold: 1
      doc_duplication_paths: "docs\nREADME.md\nCLAUDE.md\n.claude/skills"
      # issue #848: README.md・CLAUDE.mdから到達できない孤立ドキュメントを検知する。
      # .claude/skills配下はREADME.mdのSkills節でskill名のみ列挙し個別リンクしない
      # 運用のため対象外とする
      enable_doc_reachability_check: true
      doc_reachability_entry_points: "README.md\nCLAUDE.md"
      doc_reachability_paths: "docs/**/*.md"
      # issue #645「OSS依存更新の自動安全判定・エスカレーション基盤」Phase 1（issue #646）:
      # dev-standards自身の依存更新PR（Renovate等）でもRisk Summaryコメントをdogfoodingする
      enable_dependency_risk_summary: true
      # issue #647（Phase 2 Task 3）: Medium/High Risk判定時は自動マージを止める運用も
      # dogfoodingする。package-lock.jsonを変更しないPR（このPhase 2自体の実装PR群を含む）
      # ではrisk_level自体が生成されないため、他のPRの自動マージへの影響は無い
      enable_dependency_risk_gating: true
    secrets:
      # mergeジョブのスカッシュマージをBOT_TOKENで行わないと、GITHUB_TOKENによる
      # pushはGitHub Actions上で新たなワークフロー実行のトリガーにならず、
      # mainへのpushイベントが発生せずcd.ymlが起動しない（未設定時はGITHUB_TOKENに
      # フォールバックする）。
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
