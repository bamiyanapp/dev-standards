name: tmp-probe-aws-iam
# issue #1363の調査用の一時workflow（調査後に削除する）。読み取り専用。
# OIDCプロバイダの有無と、現行の認証情報の種別・権限の大きさだけを出す。アカウントIDやARNは出さない
on:
  push:
    branches:
      - claude/dev-efficiency-improvements-6wlv2c
    paths:
      - ".github/workflows/tmp-probe-aws-iam.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1
    steps:
      - name: 管理ポリシーの内訳を確認する（読み取り専用）
        run: |
          {
            echo "## 管理ポリシーの内訳（読み取り専用）"
            arn=$(aws sts get-caller-identity --query Arn --output text)
            user=$(echo "$arn" | sed -n 's|.*:user/||p')
            # AWS管理ポリシー（arn:aws:iam::aws:policy/...）は名前を出す。顧客管理ポリシーは件数だけ出す
            report() {
              label="$1"; shift
              all=$(printf '%s\n' "$@" | grep -v '^$' || true)
              aws_managed=$(echo "$all" | grep '^arn:aws:iam::aws:policy/' | sed 's|^arn:aws:iam::aws:policy/||' | sort || true)
              customer_count=$(echo "$all" | grep -vc '^arn:aws:iam::aws:policy/' || true)
              echo "### ${label}"
              echo "AWS管理ポリシー（名前）:"
              echo "$aws_managed" | sed 's/^/- /'
              echo "顧客管理ポリシー（件数のみ）: ${customer_count}"
            }
            user_arns=$(aws iam list-attached-user-policies --user-name "$user" --query 'AttachedPolicies[].PolicyArn' --output text | tr '\t' '\n')
            report "ユーザーに直接付いている管理ポリシー" "$user_arns"
            for g in $(aws iam list-groups-for-user --user-name "$user" --query 'Groups[].GroupName' --output text); do
              g_arns=$(aws iam list-attached-group-policies --group-name "$g" --query 'AttachedPolicies[].PolicyArn' --output text | tr '\t' '\n')
              report "グループに付いている管理ポリシー" "$g_arns"
              echo "グループのインラインポリシーの数: $(aws iam list-group-policies --group-name "$g" --query 'PolicyNames' --output text | wc -w)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
