<!--
  PWA起動時の白画面対策（index.htmlへの静的ローディング表示）のコピー＆調整用テンプレート。
  詳細は ../pwa-initial-loading-indicator.md を参照。
  導入時は、色（background/color）・タイトルをプロダクトに合わせて変更する。
-->
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アプリ名</title>
    <style>
      #initial-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #1f2937;
      }
      #initial-loading div {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 4px solid rgba(127, 127, 127, 0.3);
        border-top-color: currentColor;
        animation: initial-loading-spin 0.8s linear infinite;
      }
      @keyframes initial-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        #initial-loading {
          background: #1d232a;
          color: #a6adbb;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loading" aria-hidden="true">
        <div></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
